<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f5f7" id="theme-color" />
    <title>DevMask</title>
    <link rel="stylesheet" href="https://mui.kernelsu.org/internal/insets.css" />
    <script>
      ;(function () {
        // 首帧之前就把主题定下来：任何情况下都不出现"先浅后深"的白闪。
        var SETTINGS_KEY = 'devmask_settings'
        var DARK_THEME_COLOR = '#0b0e13'
        var LIGHT_THEME_COLOR = '#f4f5f7'

        var root = document.documentElement
        var themeMeta = document.getElementById('theme-color')

        var resolveStoredTheme = function () {
          try {
            var raw = window.localStorage.getItem(SETTINGS_KEY)
            if (!raw) {
              return 'system'
            }

            var parsed = JSON.parse(raw)
            var theme = parsed && parsed.theme
            return theme === 'light' || theme === 'dark' || theme === 'system' ? theme : 'system'
          } catch (error) {
            return 'system'
          }
        }

        var theme = resolveStoredTheme()
        var prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        var isDark = theme === 'dark' || (theme === 'system' && prefersDark)
        var background = isDark ? DARK_THEME_COLOR : LIGHT_THEME_COLOR

        root.classList.toggle('dark', isDark)
        root.dataset.theme = isDark ? 'dark' : 'light'
        root.style.colorScheme = isDark ? 'dark' : 'light'
        root.style.backgroundColor = background

        if (themeMeta) {
          themeMeta.setAttribute('content', background)
        }

        var applyBodyBackground = function () {
          if (!document.body) {
            return
          }

          document.body.style.margin = '0'
          document.body.style.backgroundColor = background

          var app = document.getElementById('app')
          if (app) {
            app.style.minHeight = '100vh'
            app.style.backgroundColor = background
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', applyBodyBackground, { once: true })
        } else {
          applyBodyBackground()
        }
      })()
    </script>
  </head>
  <body style="margin: 0; background: #f4f5f7">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
