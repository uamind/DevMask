<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DevMask UI · 方向 B · Passport</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --ink:#111827; --muted:#6B7280; --dim:#9AA3B2;
    --line:#E9EBF0; --brand:#2C5BFF; --brand-soft:#EDF1FF; --navy:#0E1A38; --ok:#0E9F6E; --ok-soft:#E7F7F0;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  body{background:#E8EAEE;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
       color:var(--ink);display:flex;gap:28px;padding:26px 28px 30px;align-items:flex-start}
  .slot{display:flex;flex-direction:column;gap:10px}
  .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A93A3;font-family:var(--mono);padding-left:2px}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:22px;overflow:hidden;position:relative;
         border:1px solid #DDE1E8;box-shadow:0 20px 50px rgba(17,24,39,.14)}
  .status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;color:#1F2937}
  .status .r{display:flex;gap:6px;align-items:center}
  .screen{height:calc(100% - 44px);display:flex;flex-direction:column;position:relative}
  .scroll{flex:1;overflow:hidden;padding:0 20px 90px}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:6px 0 16px}
  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:29px;height:29px;border-radius:9px;background:var(--brand);display:grid;place-items:center;box-shadow:0 6px 14px rgba(44,91,255,.28)}
  .brand .nm{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
  .ver{font-family:var(--mono);font-size:10px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 5px}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:560;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:5px 10px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(14,159,110,.14)}
  .page-hd{padding:2px 0 16px}
  .page-hd h1{font-size:27px;font-weight:730;letter-spacing:-.02em}
  .page-hd p{font-size:12.5px;color:var(--muted);margin-top:6px}
  .page-hd .cnt{font-family:var(--mono);font-size:11px;color:var(--dim);float:right;margin-top:10px}
  /* hero */
  .hero{position:relative;overflow:hidden;background:var(--navy);border-radius:22px;padding:16px 20px 14px;color:#fff;
        box-shadow:0 16px 34px rgba(14,26,56,.26)}
  .hero:before{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;
        background:radial-gradient(circle at center,rgba(76,120,255,.55),transparent 65%)}
  .hero:after{content:"";position:absolute;width:150px;height:150px;right:-30px;bottom:-90px;border-radius:50%;
        background:radial-gradient(circle at center,rgba(126,86,255,.4),transparent 68%)}
  .hero .lb{position:relative;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);font-family:var(--mono)}
  .hero h2{position:relative;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin-top:12px}
  .hero h2 span{color:#9DBCFF}
  .hero .sub{position:relative;font-size:12.5px;color:rgba(255,255,255,.62);margin-top:7px}
  .hero .foot{position:relative;display:flex;align-items:center;gap:12px;margin-top:15px}
  .hero .cta{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;
        background:#fff;color:#0E1A38;font-size:12.5px;font-weight:640}
  .hero .ghost{font-size:12.5px;color:rgba(255,255,255,.72)}
  .phones{position:absolute;right:16px;top:16px;display:flex}
  .phones i{display:block;width:26px;height:52px;border:1.4px solid rgba(255,255,255,.28);border-radius:7px;margin-left:-6px;position:relative}
  .phones i:before{content:"";position:absolute;left:50%;top:5px;transform:translateX(-50%);width:7px;height:1.4px;border-radius:2px;background:rgba(255,255,255,.35)}
  /* tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 13px;display:flex;gap:10px;align-items:center}
  .tile .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
  .tile .ic.g{background:var(--ok-soft);color:var(--ok)}
  .tile .ic.v{background:#F3EEFF;color:#7A5AF8}
  .tile .k{display:block;font-size:11px;color:var(--muted)}
  .tile .v2{display:block;font-size:14px;font-weight:640;margin-top:2px;letter-spacing:-.01em}
  .tile .v2.mono{font-family:var(--mono);font-size:12.5px}
  /* section */
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:15px 0 9px}
  .sec h3{font-size:13.5px;font-weight:660}
  .sec a{font-size:11.5px;color:var(--brand)}
  .tpls{display:flex;gap:10px}
  .tpl{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 11px;min-width:0}
  .tpl .n{font-size:12px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tpl .m{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:4px}
  .tpl .c{font-size:10.5px;color:var(--muted);margin-top:8px}
  /* recent */
  .recent{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .recent .rh{display:flex;justify-content:space-between;align-items:center;padding:11px 15px 8px;font-size:12.5px;font-weight:640}
  .recent .rh span{font-size:11px;font-weight:500;color:var(--brand)}
  .act{display:flex;align-items:center;gap:10px;padding:8px 15px;border-top:1px solid var(--line)}
  .act .d{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}
  .act .d.g{background:var(--ok)}
  .act .tx{font-size:12px;color:#374151;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act .tx b{font-weight:600}
  .act .tm{font-size:10.5px;color:var(--dim);font-family:var(--mono);flex:none}
  /* inherit */
  .inherit{margin-top:11px;background:var(--brand-soft);border-radius:16px;padding:10px 15px}
  .inherit .ih{font-size:11px;font-weight:660;color:var(--brand);letter-spacing:.02em}
  .inherit p{font-size:11.5px;line-height:1.65;color:#5A6A88;margin-top:6px}
  /* search + tabs */
  .search{height:44px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;
          align-items:center;gap:9px;padding:0 13px;color:var(--dim);font-size:13px;margin-bottom:12px}
  .tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .tabs span{font-size:13px;color:var(--muted);padding:0 1px 10px;position:relative}
  .tabs span.on{color:var(--ink);font-weight:640}
  .tabs span.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--brand)}
  .tabs b{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-weight:500;margin-left:4px}
  /* app cards */
  .cards{margin-top:9px;display:flex;flex-direction:column;gap:6px}
  .app{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px;display:flex;align-items:center;gap:11px}
  .app .av{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:600}
  .app .nm{display:block;font-size:14px;font-weight:600;letter-spacing:-.005em}
  .app .pk{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:3px}
  .app .tag{display:inline-flex;align-items:center;gap:5px;margin-left:auto;font-size:10.5px;font-weight:560;color:var(--brand);
            background:var(--brand-soft);border-radius:7px;padding:4px 8px;max-width:126px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app .tag.empty{color:var(--dim);background:#F5F6F8}
  .app .ch{margin-left:6px;color:#C3C9D4;flex:none}
  .hint{font-size:10.5px;color:var(--dim);text-align:center;margin-top:8px;line-height:1.6}
  /* nav */
  .nav{position:absolute;left:0;right:0;bottom:0;height:80px;display:flex;align-items:center;justify-content:space-around;
       background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:10px}
  .nav .it{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#98A1B0;width:64px;height:46px;justify-content:center;border-radius:12px}
  .nav .it.on{color:var(--brand);background:var(--brand-soft);font-weight:600}
  .glyph{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
