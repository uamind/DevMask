<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DevMask UI · 方向 A · Stealth</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0B0E13; --surface:#141922; --surface2:#1B2230; --line:rgba(255,255,255,.075);
    --text:#E8EEF7; --muted:#8695AC; --dim:#5C6B82; --accent:#4C8DFF; --ok:#34D399; --warn:#FBBF24;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,monospace;
  }
  body{background:#05070A;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
       color:var(--text);display:flex;gap:28px;padding:26px 28px 30px;align-items:flex-start}
  .slot{display:flex;flex-direction:column;gap:10px}
  .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5C6B82;font-family:var(--mono);padding-left:2px}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:22px;overflow:hidden;position:relative;
         border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;color:#C8D3E4}
  .status .r{display:flex;gap:6px;align-items:center;opacity:.9}
  .screen{height:calc(100% - 44px);display:flex;flex-direction:column;position:relative}
  .scroll{flex:1;overflow:hidden;padding:0 20px 104px}
  /* header */
  .hd{display:flex;align-items:center;justify-content:space-between;padding:6px 0 18px}
  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(160deg,#2E64D8,#4C8DFF);display:grid;place-items:center;
        box-shadow:0 4px 14px rgba(76,141,255,.35)}
  .brand .nm{font-size:15px;font-weight:650;letter-spacing:.01em}
  .ver{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 5px}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ok);background:rgba(52,211,153,.1);
        border:1px solid rgba(52,211,153,.22);border-radius:99px;padding:4px 9px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.16)}
  /* hero */
  .hero{padding:6px 0 22px;border-bottom:1px solid var(--line)}
  .hero h1{font-size:25px;line-height:1.32;font-weight:620;letter-spacing:-.01em;margin:12px 0 9px}
  .hero h1 em{font-style:normal;color:#A9C6FF}
  .hero p{font-size:12.5px;color:var(--muted);line-height:1.6}
  .hero-top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
  .hero-top .sp{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  /* metrics */
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .metric{padding:16px 0 15px;border-right:1px solid var(--line)}
  .metric:last-child{border-right:0}
  .metric b{display:block;font-size:23px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .metric b.ok{color:var(--ok);font-size:17px;padding-top:5px}
  .metric span{display:block;font-size:11px;color:var(--muted);margin-top:5px}
  /* card */
  .card{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .card-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 15px 11px}
  .card-hd .t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-family:var(--mono)}
  .card-hd .a{font-size:11px;color:var(--accent)}
  .srv{display:flex;align-items:center;gap:11px;padding:11px 15px;border-top:1px solid var(--line)}
  .srv .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);color:#9DB4D6;flex:none}
  .srv .body{min-width:0;flex:1}
  .srv .n{display:block;font-size:13px;font-weight:520}
  .srv .d{display:block;font-size:11px;color:var(--dim);margin-top:2px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srv .v{font-size:11.5px;color:var(--ok);flex:none}
  .srv .v.gray{color:var(--muted)}
  /* quick */
  .quick{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:7px;
       font-size:13px;font-weight:560;background:var(--surface);border:1px solid var(--line);color:var(--text)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#06101F;box-shadow:0 8px 22px rgba(76,141,255,.28)}
  /* list */
  .page-hd{padding:4px 0 14px}
  .page-hd .row1{display:flex;align-items:baseline;justify-content:space-between}
  .page-hd h2{font-size:23px;font-weight:620;letter-spacing:-.01em}
  .page-hd .cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .page-hd p{font-size:12px;color:var(--dim);margin-top:5px}
  .search{height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
          display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--dim);font-size:13px;margin-bottom:12px}
  .seg{display:flex;gap:6px;margin-bottom:6px}
  .seg span{font-size:12px;padding:6px 12px;border-radius:99px;color:var(--muted);border:1px solid transparent}
  .seg span.on{background:rgba(76,141,255,.13);border-color:rgba(76,141,255,.3);color:#B9D0FF}
  .list{margin-top:4px}
  .app{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.055)}
  .app .av{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:15px;font-weight:600;color:#fff}
  .app .nm{display:block;font-size:14px;font-weight:540;letter-spacing:.01em}
  .app .pk{display:block;font-size:10.5px;color:var(--dim);font-family:var(--mono);margin-top:3px}
  .app .tag{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;padding:4px 8px;border-radius:7px;
            background:rgba(255,255,255,.045);border:1px solid var(--line);color:#C3D2E8;max-width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app .tag.empty{color:var(--dim);border-style:dashed;background:transparent}
  .app .tag i{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:none}
  .app .ch{color:#3E4C60;margin-left:2px;flex:none}
  /* nav */
  .nav{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;align-items:center;justify-content:space-around;
       background:rgba(11,14,19,.86);backdrop-filter:blur(18px) saturate(140%);border-top:1px solid var(--line);padding-bottom:8px}
  .nav .it{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#66748A;width:64px}
  .nav .it.on{color:#CFE0FF}
  .nav .it.on .bar{position:absolute;top:-6px;width:22px;height:2px;border-radius:2px;background:var(--accent)}
  .nav .it .w{position:relative;height:26px;display:grid;place-items:center}
  .glyph{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .inherit{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .inherit .ih{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .inherit p{font-size:11.5px;line-height:1.65;color:var(--muted);margin-top:7px}
  .inherit p b{color:#C3D2E8;font-weight:600}
  .fine{font-size:9.5px;color:var(--dim);text-align:center;padding-top:14px;letter-spacing:.04em}
</style>
</head>
