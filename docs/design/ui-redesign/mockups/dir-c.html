<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DevMask UI · 方向 C · Native</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080808; --surface:#0E0E0E; --surface2:#141414; --line:#232323; --line2:#2E2E2E;
    --text:#F2F2F2; --muted:#8A8A8A; --dim:#5E5E5E; --lime:#CDF564; --lime-dim:#9DBC48;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,monospace;
  }
  body{background:#000;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--text);
       display:flex;gap:28px;padding:26px 28px 30px;align-items:flex-start}
  .slot{display:flex;flex-direction:column;gap:10px}
  .cap{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5E5E5E;padding-left:2px}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:20px;overflow:hidden;position:relative;border:1px solid #262626;box-shadow:0 22px 54px rgba(0,0,0,.75)}
  .status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-family:var(--mono);font-size:11.5px;color:#CFCFCF}
  .status .r{display:flex;gap:6px;align-items:center}
  .screen{height:calc(100% - 44px);display:flex;flex-direction:column;position:relative}
  .scroll{flex:1;overflow:hidden;padding:0 20px 84px}
  /* header */
  .hd{padding:6px 0 14px;border-bottom:1px solid var(--line)}
  .hd .r1{display:flex;align-items:baseline;gap:8px}
  .hd .logo{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em}
  .hd .logo i{color:var(--lime);font-style:normal}
  .hd .ver{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line2);padding:2px 6px}
  .hd .r2{display:flex;align-items:center;gap:8px;margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .hd .r2 b{color:var(--lime);font-weight:500}
  .hd .r2 .sep{color:#333}
  /* stat grid */
  .stats{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
  .stat{padding:15px 0 13px;border-right:1px solid var(--line)}
  .stat:nth-child(2n){border-right:0;padding-left:16px}
  .stat b{display:block;font-family:var(--mono);font-size:33px;font-weight:500;letter-spacing:-.04em;line-height:1}
  .stat b.lime{color:var(--lime)}
  .stat span{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:7px}
  /* system list */
  .sec{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin:18px 0 8px;display:flex;justify-content:space-between}
  .sec a{color:var(--lime);text-decoration:none;letter-spacing:.04em}
  .kv{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid #1B1B1B;font-size:12px}
  .kv .k{color:#D6D6D6}
  .kv .lead{flex:1;border-bottom:1px dotted #2A2A2A;transform:translateY(-3px)}
  .kv .v{font-family:var(--mono);font-size:11px;color:var(--lime);text-align:right}
  .kv .v.mut{color:var(--muted)}
  /* buttons */
  .acts{display:flex;gap:8px;margin-top:16px}
  .b1{flex:1;height:42px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:600;
      background:var(--lime);color:#0A0A0A;border:1px solid var(--lime)}
  .b2{flex:1;height:42px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:#E4E4E4;
      background:transparent;border:1px solid var(--line2)}
  /* log */
  .log{margin-top:16px;border:1px solid var(--line);background:var(--surface)}
  .log .lh{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.12em}
  .log .li{display:flex;gap:8px;padding:7px 10px;font-family:var(--mono);font-size:10px;color:#B9B9B9;border-bottom:1px solid #1A1A1A}
  .log .li:last-child{border-bottom:0}
  .log .li i{color:var(--lime);font-style:normal}
  .log .li span{color:var(--dim);margin-left:auto;white-space:nowrap}
  /* apps */
  .ph{padding:2px 0 10px}
  .ph h1{font-size:21px;font-weight:650;letter-spacing:.01em}
  .ph p{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:5px}
  .ph p b{color:var(--lime);font-weight:500}
  .search{height:40px;border:1px solid var(--line2);display:flex;align-items:center;gap:8px;padding:0 11px;font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-bottom:10px;background:var(--surface)}
  .search .car{color:var(--lime)}
  .search .cursor{width:1px;height:14px;background:var(--lime);animation:none;margin-left:1px}
  .chips{display:flex;gap:6px;margin-bottom:8px}
  .chips span{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:5px 9px;border:1px solid var(--line2);color:var(--muted)}
  .chips span.on{background:var(--lime);border-color:var(--lime);color:#0A0A0A;font-weight:600}
  .row{display:flex;align-items:center;gap:11px;padding:9px 0 9px 9px;border-bottom:1px solid #1C1C1C;position:relative}
  .row.on:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;background:var(--lime)}
  .row .sq{width:32px;height:32px;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;
           font-family:var(--mono);font-size:12px;color:#DADADA;flex:none}
  .row.on .sq{border-color:#3A3A3A;color:#fff}
  .row .nm{font-size:13px;font-weight:520}
  .row .pk{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:2px}
  .row .md{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--lime-dim);letter-spacing:.02em;text-align:right;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .md.x{color:#3F3F3F}
  .note{margin-top:14px;border-left:2px solid var(--line2);padding:2px 0 2px 10px;font-family:var(--mono);font-size:10px;line-height:1.7;color:var(--dim)}
  /* nav */
  .nav{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;border-top:1px solid var(--line2);background:#080808;padding:0 6px}
  .nav .it{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
           font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:#5E5E5E;border-right:1px solid #171717}
  .nav .it:last-child{border-right:0}
  .nav .it.on{color:var(--lime)}
  .glyph{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
