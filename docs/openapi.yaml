openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Device Faker HTTP API
  summary: 模块自带 Web 服务的 /api/v1 契约（第一增量）
  version: 1.11.0
  description: |
    Device Faker 原生服务（device_faker_server 1.11.0）的 HTTP 契约；版本号随模块发布递增，端点与字段只增不改（egress 自 1.10.0、relay 自 1.11.0）。

    约定：
    - 基地址默认 http://127.0.0.1:8686，API 前缀 /api/v1。
    - 认证 Authorization: Bearer <token>；作用域 read / write / ops / admin。
    - 配置内容字段一律 snake_case（与 config.toml 同名同义）；API 元数据 lowerCamelCase；查询参数 snake_case。
    - 所有写操作必须带 If-Match（当前配置 revision）；不匹配返回 412，不自动合并。
    - 错误统一信封 error.code / error.message / error.details / error.retryable / error.requestId。
    - 本增量不含 MCP、plan/apply、备份管理、审计查询、Token 管理、应用名与图标。
    - egress（出口代理）自 v1.10.0 起提供：设备级 HTTP 代理 + 应用级 SOCKS5 注入 + 出口 IP 探测；egress 端点用独立的 egress revision（响应头 X-DF-Egress-Revision），不返回 X-DF-Revision / ETag。
    - v1.11.0 起增设备内认证中继（relay）：带凭据的代理注入 127.0.0.1:<local_port>，由 root 进程补 HTTP Basic / SOCKS5 RFC1929；新增第 30 个操作 POST /api/v1/egress/relay/restart，GET /egress 增 relay 对象，probe 增 via / relayPort。
  termsOfService: https://github.com/Seyud/device_faker
  contact:
    name: Device Faker
    url: https://github.com/Seyud/device_faker
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: http://127.0.0.1:8686
    description: 设备本机（默认绑定，仅 loopback）
  - url: http://localhost:8686
    description: adb forward tcp:8686 tcp:8686 后的桌面调试地址
security:
  - bearerAuth: []
tags:
  - name: System
    description: 探活、状态、JSON Schema
  - name: Config
    description: 配置读取、revision、整体替换、文本校验
  - name: Templates
    description: 机型模板 CRUD 与包名绑定
  - name: Apps
    description: 内联应用配置与模板绑定、重启
  - name: Packages
    description: 已安装包元数据
  - name: Device
    description: 设备信息、getprop 白名单、用户列表
  - name: Egress
    description: 出口代理（设备级 HTTP 代理、应用级 SOCKS5 注入、出口 IP 探测、代理定义列表）
paths:
  /api/v1/healthz:
    get:
      tags:
        - System
      operationId: getHealthz
      summary: 存活探针
      description: 无需认证。用于 WebUI 探测原生服务与进程探针。
      security: []
      responses:
        '200':
          description: 服务存活
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 1.11.0
                uptimeSec: 3600
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/status:
    get:
      tags:
        - System
      operationId: getStatus
      summary: 模块 / 设备 / 服务 / 配置状态
      description: |
        AI 的入口调用。返回模块版本、设备摘要、服务运行时信息与当前配置 revision。
        capabilities 列出本增量已实现的能力标签；缺失标签代表能力不可用。
      responses:
        '200':
          description: 状态快照
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-DF-Revision:
              $ref: '#/components/headers/XDFRevision'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                module: {id: device_faker, version: v1.11.0, versionCode: 20261202}
                device: {manufacturer: Google, brand: google, model: Pixel 9, device: tokay, android: '17', sdk: 37, abi: arm64-v8a}
                server: {version: 1.11.0, bind: '127.0.0.1:8686', uptimeSec: 3600, startedAt: '2026-11-24T03:00:00Z'}
                config:
                  revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                  mtime: '2026-11-24T03:00:00Z'
                  size: 9361
                  exists: true
                  templates: 26
                  apps: 27
                  conflicts: 0
                capabilities: [config, templates, apps, packages, device, validate, overview, egress]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/overview:
    get:
      tags:
        - System
      operationId: getOverview
      summary: 设备、模板与每个应用配置的汇总
      description: |
        一次返回设备 Build 摘要与物理 fingerprint、模块/服务/配置状态、全部模板，
        以及每个已配置包名的来源（inline / template）与最终生效值（含 Build.FINGERPRINT）。
        只包含「已配置」的包，不枚举整台设备；适合 AI 一次读取全局状态。
      responses:
        '200':
          description: 汇总快照
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-DF-Revision:
              $ref: '#/components/headers/XDFRevision'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
              example:
                revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                module: {id: device_faker, version: v1.11.0, versionCode: 20261202}
                device: {manufacturer: Google, brand: google, model: Pixel 9, device: tokay, android: '17', sdk: 37, abi: arm64-v8a, fingerprint: 'google/tokay/tokay:17/BP2A.250605.031/13000000:user/release-keys'}
                root: {manager: kernelsu, version: 1.0.7}
                server: {version: 1.11.0, bind: '127.0.0.1:8686', uptimeSec: 3600, startedAt: '2026-11-24T03:00:00Z', pid: 4321}
                config: {revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5', mtime: '2026-11-24T03:00:00Z', size: 9361, exists: true, templates: 2, apps: 1, conflicts: 1}
                templates:
                  - name: pixel_9
                    position: 0
                    packages: [com.example.app, com.example.shared]
                    config: {brand: google, model: Pixel 9, dpi: 420}
                apps:
                  - package: com.example.app
                    installed: true
                    source: {type: template, template: pixel_9, alsoInline: false}
                    resolved: {brand: google, model: Pixel 9, dpi: 420}
                    warnings: []
                  - package: com.example.shared
                    installed: true
                    source: {type: template, template: pixel_9, alsoInline: false}
                    resolved: {brand: google, model: Pixel 9, dpi: 420}
                    warnings: [{code: duplicate_package, message: 'com.example.shared 同时被 pixel_9 与 pixel_9_pro 声明', details: {package: com.example.shared, templates: [pixel_9, pixel_9_pro]}}]
                warnings: [{code: duplicate_package, message: 'com.example.shared 同时被 pixel_9 与 pixel_9_pro 声明', details: {package: com.example.shared, templates: [pixel_9, pixel_9_pro]}}]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/schema/config:
    get:
      tags:
        - System
      operationId: getConfigSchema
      summary: 配置 JSON Schema
      description: 返回单份 Config 的 JSON Schema（draft-07，schemars 0.8 生成；字段在顶层 properties，被引用类型在 definitions），用于客户端动态生成表单或校验。
      responses:
        '200':
          description: JSON Schema 文档
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSchema'
              example:
                $schema: 'http://json-schema.org/draft-07/schema#'
                title: DeviceFakerConfig
                type: object
                properties:
                  apps: {default: [], items: {'$ref': '#/definitions/AppConfig'}, type: array}
                  debug: {default: false, type: boolean}
                  default_force_denylist_unmount: {default: false, type: boolean}
                  default_hide_maps: {default: [], items: {type: string}, type: array}
                  templates: {additionalProperties: {'$ref': '#/definitions/DeviceTemplate'}, default: {}, type: object}
                definitions:
                  NumberSetting:
                    anyOf:
                      - {type: integer, minimum: 1.0, maximum: 1000.0, description: 整数伪装值（sdk_int）}
                      - {type: string, const: __DELETE__, description: 删除 ro.build.version.sdk 整族}
                    description: 整数伪装值，或字符串 __DELETE__
                    title: NumberSetting
                  DeviceTemplate: {description: 机型模板, type: object}
                  AppConfig: {required: [package], type: object}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/config:
    get:
      tags:
        - Config
      operationId: getConfig
      summary: 读取配置（JSON 或 TOML）
      description: |
        format=json（默认）返回带 revision 包装的 ConfigResponse；format=toml 返回配置文件原文（保留注释与顺序）。
        配置文件不存在时仍返回 200，exists=false 且 config 为空文档，warnings 含 config_missing。
      parameters:
        - name: format
          in: query
          required: false
          description: 响应格式。json 返回 ConfigResponse，toml 返回 text/plain 原文。
          schema:
            type: string
            enum: [json, toml]
            default: json
            example: json
      responses:
        '200':
          description: 配置内容（媒体类型随 format 变化）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-DF-Revision:
              $ref: '#/components/headers/XDFRevision'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
              examples:
                present:
                  summary: 配置文件存在
                  value:
                    revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                    mtime: '2026-11-24T03:00:00Z'
                    size: 9361
                    exists: true
                    warnings: []
                    config:
                      debug: false
                      default_force_denylist_unmount: false
                      default_hide_maps: []
                      templates:
                        pixel_9:
                          packages: [com.example.app]
                          manufacturer: Google
                          brand: google
                          model: Pixel 9
                          device: tokay
                          android_version: '15'
                          sdk_int: 35
                          dpi: 420
                          custom_props: {ro.product.vendor.model: Pixel 9}
                      apps:
                        - {package: com.example.two, manufacturer: Xiaomi, model: 2509FPN0BC, dpi: 420}
                missing:
                  summary: 配置文件不存在（首次启动 / host 测试）
                  value:
                    revision: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
                    mtime: null
                    size: 0
                    exists: false
                    warnings:
                      - {code: config_missing, message: 配置文件不存在，返回空配置文档, details: {}}
                    config: {debug: false, default_force_denylist_unmount: false, default_hide_maps: [], templates: {}, apps: []}
            text/plain:
              schema:
                type: string
                description: config.toml 原文（format=toml）
                example: |
                  debug = false
                  default_force_denylist_unmount = false

                  [templates.pixel_9]
                  packages = ["com.example.app"]
                  brand = "google"
                  model = "Pixel 9"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Config
      operationId: putConfig
      summary: 整体替换配置
      description: |
        请求体可以是 ConfigDocument（application/json），也可以是 TOML 原文（application/toml 或 text/plain）。
        TOML 原文路径按提交内容整体重写（注释与未知字段以提交内容为准）；结构化端点才保证注释不丢。
        If-Match 必填；dry_run=true 时只校验并返回 diff，不落盘、不备份。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/Diff'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: ConfigDocument（JSON）或 TOML 原文。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigDocument'
            example:
              debug: false
              default_force_denylist_unmount: false
              default_hide_maps: []
              templates:
                pixel_9: {packages: [com.example.app], brand: google, model: Pixel 9, android_version: '15', sdk_int: 35}
              apps:
                - {package: com.example.two, manufacturer: Xiaomi, model: 2509FPN0BC}
          application/toml:
            schema:
              type: string
              description: config.toml 原文
              example: |
                debug = false
                [templates.pixel_9]
                packages = ["com.example.app"]
          text/plain:
            schema:
              type: string
              description: config.toml 原文（text/plain 等价于 application/toml）
      responses:
        '200':
          description: 写入结果（或 dry_run 的预演结果）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-DF-Revision:
              $ref: '#/components/headers/XDFRevision'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResult'
              example:
                revision: '1a7b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9'
                previousRevision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                dryRun: false
                backupId: 20261124T031002Z-9f2c
                diff: "--- a/config.toml\n+++ b/config.toml\n@@ -1,2 +1,3 @@\n debug = false\n+default_hide_maps = []\n"
                diffTruncated: false
                warnings: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '412':
          $ref: '#/components/responses/RevisionMismatch'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/config/revision:
    get:
      tags:
        - Config
      operationId: getConfigRevision
      summary: 取配置 revision
      description: 轻量端点，写入前用它取 If-Match。
      responses:
        '200':
          description: revision 与文件元信息
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-DF-Revision:
              $ref: '#/components/headers/XDFRevision'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigRevisionResponse'
              examples:
                present:
                  summary: 配置文件存在
                  value:
                    revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                    mtime: '2026-11-24T03:00:00Z'
                    size: 9361
                    exists: true
                missing:
                  summary: 配置文件不存在（首次启动 / host 测试）
                  value:
                    revision: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
                    mtime: null
                    size: 0
                    exists: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/config/validate:
    post:
      tags:
        - Config
      operationId: validateConfig
      summary: 校验配置文本
      description: |
        校验任意 TOML/JSON 文本，不落盘、不需要 If-Match。校验失败也返回 200，用 valid=false 区分；
        errors 给出字段级原因，revision 是校验时的当前配置 revision。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
            example:
              format: toml
              content: |
                debug = false

                [templates.pixel_9]
                packages = ["com.example.app"]
                dpi = 900
      responses:
        '200':
          description: 校验结果（valid=false 仍为 200）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
              example:
                valid: false
                revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                errors:
                  - {path: templates.pixel_9.dpi, code: out_of_range, message: 'dpi 必须在 120..=640'}
                warnings: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/templates:
    get:
      tags:
        - Templates
      operationId: listTemplates
      summary: 模板列表（保序）
      description: 顺序等于 config.toml 中 [templates] 的书写顺序，分页也不打乱。可用 package 过滤只含该包名的模板。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: package
          in: query
          required: false
          description: 只返回 packages 中含该包名的模板（支持 pkg@userId 精确匹配）。
          schema:
            type: string
            example: com.example.app
      responses:
        '200':
          description: 模板列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-DF-Revision:
              $ref: '#/components/headers/XDFRevision'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResponse'
              example:
                revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                total: 2
                nextCursor: null
                items:
                  - {name: pixel_9, position: 0, packages: [com.example.app], packageCount: 1, fieldsSet: [android_version, brand, dpi, manufacturer, model, sdk_int]}
                  - {name: samsung_s24_ultra, position: 1, packages: ['com.other.app@999'], packageCount: 1, fieldsSet: [brand, dpi, model]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/templates/{name}:
    parameters:
      - $ref: '#/components/parameters/TemplateName'
    get:
      tags:
        - Templates
      operationId: getTemplate
      summary: 模板详情
      description: position 是该模板在配置文件中的 0 基序号；revision 是整份配置的 revision。
      responses:
        '200':
          description: 模板详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-DF-Revision:
              $ref: '#/components/headers/XDFRevision'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
              example:
                revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                position: 0
                name: pixel_9
                template:
                  packages: [com.example.app]
                  manufacturer: Google
                  brand: google
                  model: Pixel 9
                  device: tokay
                  android_version: '15'
                  sdk_int: 35
                  dpi: 420
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Templates
      operationId: putTemplate
      summary: 新建或整体替换模板
      description: |
        整体替换语义：请求体未出现的字段视为删除；packages 未出现等价于空数组（会解绑全部包名并回 empty_packages 警告）。
        已存在的模板保持原 position，新模板追加到末尾。If-Match 必填。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/Diff'
        - $ref: '#/components/parameters/AllowDuplicatePackage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
