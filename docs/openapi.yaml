                root: {manager: kernelsu, version: 1.0.7}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/device/props:
    get:
      tags:
        - Device
      operationId: getDeviceProps
      summary: getprop 白名单读取
      description: |
        只允许读取白名单前缀的属性：ro.product.、ro.build.、ro.soc.、ro.hardware、ro.board.、ro.vendor.。
        keys 为逗号分隔的 1..50 个键，每个不超过 128 字符；不在白名单或超限返回 422。
      parameters:
        - name: keys
          in: query
          required: true
          description: 逗号分隔的属性键。
          schema:
            type: string
            example: ro.product.model,ro.build.fingerprint
      responses:
        '200':
          description: 属性值
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePropsResponse'
              example:
                props:
                  ro.product.model: Pixel 9
                  ro.build.fingerprint: 'google/tokay/tokay:17/BP2A.250605.031/13000000:user/release-keys'
                missing: [ro.vendor.does_not_exist]
                source: getprop
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /api/v1/device/users:
    get:
      tags:
        - Device
      operationId: listDeviceUsers
      summary: 用户列表
      description: 返回 Android 多用户信息，供 pkg@userId 配置与包列表按用户过滤使用。
      responses:
        '200':
          description: 用户列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceUsersResponse'
              example:
                users:
                  - {id: 0, name: Owner, running: true, isCurrent: true}
                  - {id: 999, name: Work, running: true, isCurrent: false}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/egress:
    get:
      tags: [Egress]
      operationId: getEgress
      summary: 出口代理状态
      description: |
        一次拿到「期望模式 + 实际模式 + 设备上真实读回的生效值 + 脱敏上游 + 各应用覆盖 + 最近探测」。
        响应头是 X-DF-Egress-Revision（egress revision）：本端点**不**返回 X-DF-Revision / ETag，
        否则会污染 WebUI 缓存的 config revision。写端点的 If-Match 也用它。
      responses:
        '200':
          description: 当前出口状态
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-DF-Egress-Revision: {$ref: '#/components/headers/XDFEgressRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EgressResponse'}
              example:
                revision: '5b1f0c9e8d7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c'
                configRevision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                configured: true
                mode: proxy
                effectiveMode: proxy
                default: office_http
                failOpen: true
                probeUrl: 'http://checkip.example.com/'
                probeTimeoutSeconds: 5
                exclusionList: ['10.0.0.0/8']
                upstream: {name: office_http, type: http, host: 198.51.100.10, port: 8080, hasCredentials: false}
                proxies:
                  - {name: office_http, type: http, host: 198.51.100.10, port: 8080, hasCredentials: false, localPort: null, relayActive: false}
                  - {name: lab_socks, type: socks5, host: 198.51.100.20, port: 1080, hasCredentials: true, localPort: 17831, relayActive: true}
                relay:
                  enabled: true
                  basePort: 17800
                  failOpen: true
                  at: '2026-12-01T03:00:00Z'
                  limits: {maxConnections: 256, maxConnectionsPerUid: 64}
                  listeners:
                    - {proxy: lab_socks, port: 17831, scope: app, listening: true, uidPolicy: restricted, allowedUids: [0, 10123], activeConnections: 0, lastError: null}
                  firewall: {applied: true, rules: 9, allowRules: 7, denyRules: 1, lastError: null}
                  portChanges: []
                  restartRequiredApps: []
                apps:
                  - {package: com.example.a, egress: lab_socks, effective: proxy, proxy: lab_socks}
                  - {package: com.example.b, egress: __DIRECT__, effective: direct, proxy: null}
                applied: true
                readback:
                  settingsValue: '198.51.100.10:8080'
                  dumpsysGlobalProxy: 'Global proxy: [198.51.100.10] port: 8080'
                  matches: true
                  at: '2026-12-01T03:00:00Z'
                health:
                  degraded: false
                  degradedSince: null
                  degradedReason: null
                  lastProbe:
                    ok: true
                    exitIp: 198.51.100.77
                    latencyMs: 412
                    checkedAt: '2026-12-01T02:59:12Z'
                    scope: device
                    via: proxy
                    proxy: office_http
                    upstreamStatus: 200
                    errorCode: null
                egressFile: {exists: true, size: 412, mtime: '2026-12-01T02:58:03Z'}
                warnings: []
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenScope'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Egress]
      operationId: putEgress
      summary: 写入代理定义与出口策略（并应用设备级 HTTP 代理）
      description: |
        省略 = 不改；null = 清空；给数组 = 整体替换该数组。proxies 省略时已存定义与密码原样保留。
        期望状态与当前一致时不写盘、不备份、不动 mtime，返回 changed=false 且 revision 不变（幂等）。
        写入顺序：先 egress.toml、再 config.toml，最后应用 settings global http_proxy；
        应用失败不回滚文件（差异由 applied / readback 暴露）。本端点不自动探测。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/Diff'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EgressUpdateRequest'}
            example:
              default: office_http
              failOpen: true
              probeUrl: 'http://checkip.example.com/'
              probeTimeoutSeconds: 5
              exclusionList: ['10.0.0.0/8']
              proxies:
                - {name: office_http, type: http, host: 198.51.100.10, port: 8080}
                - {name: lab_socks, type: socks5, host: 198.51.100.20, port: 1080, username: user, password: '<PASSWORD>'}
              apps:
                - {package: com.example.a, egress: lab_socks}
                - {package: com.example.b, egress: __DIRECT__}
      responses:
        '200':
          description: 写入结果（含写入后的真实状态）
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-DF-Egress-Revision: {$ref: '#/components/headers/XDFEgressRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EgressWriteResult'}
              example:
                revision: '8c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f'
                previousRevision: '5b1f0c9e8d7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c'
                configRevision: '77aabbccddeeff00112233445566778899aabbccddeeff001122334455667788'
                dryRun: false
                changed: true
                backupId: 20261201T030000Z-5b1f
                diffTruncated: false
                configured: true
                mode: proxy
                effectiveMode: proxy
                default: office_http
                applied: true
                warnings: []
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenScope'}
        '412': {$ref: '#/components/responses/EgressRevisionMismatch'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    delete:
      tags: [Egress]
      operationId: deleteEgress
      summary: 恢复直连（清空定义与系统代理）
      description: |
        清除 [proxies.*]、[egress].default、所有 [[apps]].egress 与 global_http_proxy_exclusion_list，
        并执行 settings put global http_proxy :0（settings delete 在 Android 17 上清不掉）。
        [probe] 段保留。已经是直连且无定义时返回 changed=false。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Confirm'
      responses:
        '200':
          description: 已恢复直连
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-DF-Egress-Revision: {$ref: '#/components/headers/XDFEgressRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EgressWriteResult'}
              example:
                revision: '5b1f0c9e8d7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c'
                previousRevision: '8c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f'
                configRevision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                dryRun: false
                changed: true
                backupId: 20261201T031500Z-8c1d
                diffTruncated: false
                configured: false
                mode: direct
                effectiveMode: direct
                default: null
                applied: true
                warnings: []
        '400': {$ref: '#/components/responses/ConfirmationRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenScope'}
        '412': {$ref: '#/components/responses/EgressRevisionMismatch'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /api/v1/egress/probe:
    post:
      tags: [Egress]
      operationId: probeEgress
      summary: 经当前生效链路探测出口 IP
      description: |
        用当前链路请求 probe URL（默认 http://checkip.amazonaws.com/，只接受 http://），5 秒超时，
        返回出口 IP / 延迟 / 时间。失败走错误信封（409 egress.not_configured / 502 egress.probe_failed），
        不用 200 包 ok:false。探测本身不回落；fail-open 只影响流量链路。
        scope=app 时 approximate 恒为 true（探测在服务进程内完成，不代表目标进程真实链路）。
        不需要 If-Match，也不支持 Idempotency-Key。
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EgressProbeRequest'}
            example: {package: null, url: 'http://checkip.example.com/', via: upstream}
      responses:
        '200':
          description: 探测成功
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-DF-Egress-Revision: {$ref: '#/components/headers/XDFEgressRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EgressProbeResponse'}
              example:
                ok: true
                exitIp: 198.51.100.77
                latencyMs: 412
                checkedAt: '2026-12-01T03:00:00Z'
                scope: device
                via: proxy
                proxy: office_http
                relayPort: null
                url: 'http://checkip.example.com/'
                upstreamStatus: 200
                approximate: false
                warnings: []
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenScope'}
        '409': {$ref: '#/components/responses/EgressNotConfigured'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/EgressProbeFailed'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /api/v1/egress/proxies:
    get:
      tags: [Egress]
      operationId: listEgressProxies
      summary: 代理定义列表（脱敏）
      description: |
        返回全部代理定义的脱敏摘要与引用关系（usedAsDefault / apps），永远不含 username / password，
        唯一凭据信号是 hasCredentials。不分页（定义上限 64 条）。
      responses:
        '200':
          description: 代理定义列表
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-DF-Egress-Revision: {$ref: '#/components/headers/XDFEgressRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EgressProxiesResponse'}
              example:
                revision: '5b1f0c9e8d7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c'
                configRevision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                total: 2
                egressFile: {exists: true, size: 412, mtime: '2026-12-01T02:58:03Z'}
                items:
                  - {name: office_http, type: http, host: 198.51.100.10, port: 8080, hasCredentials: false, localPort: null, relayActive: false, usedAsDefault: true, apps: []}
                  - {name: lab_socks, type: socks5, host: 198.51.100.20, port: 1080, hasCredentials: true, localPort: 17831, relayActive: true, usedAsDefault: false, apps: [com.example.a]}
                warnings: []
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenScope'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/egress/relay/restart:
    post:
      tags: [Egress]
      operationId: restartEgressRelay
      summary: 重建设备内认证中继（强制 apply）
      description: |
        重新读取 [relay] 与 [proxies]，全量重建 listener 与 uid 防火墙，并重放设备级 settings。
        强制 apply：即使内存态与期望一致、iptables -S 也一致，也会重装一遍；手工 -F 之后调用它可把
        firewall.applied 修回 true（applied 由 -S 现算）。端口与 uid 集合未变的 listener 不关闭、不中断连接。
        请求体可为空对象，不接受任何字段（出现字段即 422 unknown_field）。
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
            example: {}
      responses:
        '200':
          description: 重建结果
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-DF-Egress-Revision: {$ref: '#/components/headers/XDFEgressRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EgressRelayRestartResponse'}
              example:
                restartedAt: '2026-12-01T03:05:00Z'
                relay:
                  enabled: true
                  basePort: 17800
                  failOpen: true
                  at: '2026-12-01T03:05:00Z'
                  limits: {maxConnections: 256, maxConnectionsPerUid: 64}
                  listeners:
                    - {proxy: lab_socks, port: 17831, scope: app, listening: true, uidPolicy: restricted, allowedUids: [0, 10123], activeConnections: 0, lastError: null}
                  firewall: {applied: true, rules: 9, allowRules: 7, denyRules: 1, lastError: null}
                  portChanges: []
                  restartRequiredApps: []
                warnings: []
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenScope'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: df_<base64url>
      description: |
        Token 明文形如 df_ 加 43 字符 base64url，落盘只存 sha256。
        作用域 read / write / ops / admin 互不隐含（admin 是其余三个的超集）。
        缺失或无效返回 401 unauthorized；作用域不足返回 403 forbidden_scope。
  headers:
    XRequestId:
      description: 请求关联 ID；客户端可通过同名请求头指定，服务端原样回填
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
        example: req_01JC7Z6Q3M8V2S9K4T1B0A
    XDFRevision:
      description: 当前配置 revision（不带引号）
      schema:
        type: string
        example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
    ETag:
      description: 强校验值，带引号的 revision，可直接作为 If-Match 回传
      schema:
        type: string
        example: '"9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5"'
    XDFEgressRevision:
      description: 当前 egress revision（不带引号；不是 config revision）。egress 端点只回这个头，不回 X-DF-Revision / ETag
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
        example: '5b1f0c9e8d7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c'
    RetryAfter:
      description: 建议重试等待秒数
      schema:
        type: integer
        minimum: 1
        example: 30
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前配置 revision（带或不带引号均可；* 表示无条件写）。缺失 428 precondition_required，不匹配 412 config_revision_mismatch。
      schema:
        type: string
        example: '"9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5"'
    DryRun:
      name: dry_run
      in: query
      required: false
      description: 只执行校验与 diff 计算，不落盘、不备份
      schema:
        type: boolean
        default: false
        example: false
    Diff:
      name: diff
      in: query
      required: false
      description: 写入成功时返回 unified diff（上限 64 KiB，超出置 diffTruncated=true）
      schema:
        type: boolean
        default: false
        example: true
    Confirm:
      name: confirm
      in: query
      required: true
      description: 破坏性操作确认，必须为 true；缺失返回 400 confirmation_required
      schema:
        type: boolean
        example: true
    DetachTemplates:
      name: detach_templates
      in: query
      required: false
      description: 为 true 时同时把该包名从所有模板的 packages 中移除
      schema:
        type: boolean
        default: false
        example: false
    AllowDuplicatePackage:
      name: allow_duplicate_package
      in: query
      required: false
      description: 允许写出「同一包名出现在多个模板」并返回 duplicate_package 警告；默认拒绝（409）
      schema:
        type: boolean
        default: false
        example: false
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键（不超过 128 字符，保留 24 小时）；目前仅 POST /apps/{pkg}/restart 生效
      schema:
        type: string
        maxLength: 128
        example: restart-com.example.app-1
    Limit:
      name: limit
      in: query
      required: false
      description: 每页数量，默认 50，最大 500
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
        example: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页响应里的 nextCursor（不透明字符串）
      schema:
        type: string
        example: eyJvIjo1MH0
    TemplateName:
      name: name
      in: path
      required: true
      description: 模板名（配置键，不是模板字段 name），需百分号编码
      schema:
        type: string
        pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$'
        example: pixel_9
    PackagePath:
      name: pkg
      in: path
      required: true
      description: Java 包名，可带 @userId（@ 需编码为 %40）
      schema:
        type: string
        pattern: '^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+(@[0-9]{1,5})?$'
        example: com.example.app
  responses:
    Unauthorized:
      description: 缺少、格式错误或无效的 Bearer Token
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: 缺少或无效的 Bearer Token
              details: null
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    ForbiddenScope:
      description: Token 作用域不足
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden_scope
              message: 当前 Token 缺少 write 作用域
              details: {required: write, granted: [read]}
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    NotFound:
      description: 资源不存在（含未实现的 /api/v1 路径）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: 模板不存在
              details: {resource: template, name: pixel_9}
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    MethodNotAllowed:
      description: 路径存在但不支持该方法
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: method_not_allowed
              message: 该方法不受支持
              details: {method: GET, path: /api/v1/config}
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    ConfirmationRequired:
      description: 破坏性操作缺少 confirm=true
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: confirmation_required
              message: 需要 confirm=true 才可执行删除
              details: {action: delete_template}
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    DuplicatePackageConflict:
      description: 会写出重复包名，需要 allow_duplicate_package=true
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict_duplicate_package
              message: 包名已绑定到其它模板
              details: {package: com.example.app, templates: [samsung_s24_ultra]}
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    RevisionMismatch:
      description: If-Match 与当前配置 revision 不一致（不自动合并）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-DF-Revision:
          $ref: '#/components/headers/XDFRevision'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: config_revision_mismatch
              message: 配置已被其他客户端修改
              details:
                expected: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
                actual: '1a7b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9'
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    PreconditionRequired:
      description: 写请求缺少 If-Match
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: precondition_required
              message: 写操作必须带 If-Match
              details: {header: If-Match}
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    ValidationFailed:
      description: 请求体或配置语义不合法
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_failed
              message: 配置校验失败
              details:
                errors:
                  - {path: templates.pixel_9.dpi, code: out_of_range, message: 'dpi 必须在 120..=640'}
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    BodyTooLarge:
      description: 请求体超过上限（默认 2 MiB）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: body_too_large
              message: 请求体超过 2 MiB
              details: {limitBytes: 2097152}
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    UnsupportedMediaType:
      description: Content-Type 不受支持
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unsupported_media_type
              message: 不支持的 Content-Type
              details: {supported: [application/json, application/toml, text/plain]}
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    RateLimited:
      description: 触发限流
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: 请求过于频繁
              details: {limit: 30, windowSec: 60}
              retryable: true
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    InternalError:
      description: 未预期错误，用 requestId 查服务日志
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: 服务内部错误
              details: null
              retryable: true
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    EgressRevisionMismatch:
      description: egress 的 If-Match 与当前 egress revision 不一致（client 应重新 GET /api/v1/egress）
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-DF-Egress-Revision: {$ref: '#/components/headers/XDFEgressRevision'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            error:
              code: config_revision_mismatch
              message: egress 已被其他客户端修改
              details:
                expected: '5b1f0c9e8d7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c'
                actual: '8c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f'
                resource: egress
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    EgressNotConfigured:
      description: 没有任何可用出口（设备级无 default 且无代理定义，或该应用既无覆盖也无设备级默认）
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            error:
              code: egress.not_configured
              message: 没有可用的出口代理
              details: {scope: device, package: null}
              retryable: false
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    EgressProbeFailed:
      description: 出口探测失败（连接 / DNS / 超时 / TLS / 非 2xx / 响应不是 IP）
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            error:
              code: egress.probe_failed
              message: 出口探测超时
              details: {url: 'http://checkip.example.com/', reason: timeout, timeoutMs: 5000, upstreamStatus: null}
              retryable: true
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    UpstreamUnavailable:
      description: 系统命令（pm / am / getprop）不可用或超时
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: upstream_unavailable
              message: am 命令执行失败
              details: {component: am}
              retryable: true
              requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
  schemas:
    ErrorResponse:
      type: object
      description: 统一错误信封，所有 4xx 与 5xx 响应体
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      example:
        error:
          code: config_revision_mismatch
          message: 配置已被其他客户端修改
          details:
            expected: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
            actual: '1a7b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9'
          retryable: false
          requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    ErrorBody:
      type: object
      description: 错误内容；code 稳定可用于分支，message 供人阅读，details 为结构化原因
      required: [code, message, details, retryable, requestId]
      additionalProperties: false
      properties:
        code:
          type: string
          description: 稳定错误码
          enum: [unauthorized, forbidden_scope, not_found, method_not_allowed, confirmation_required, conflict_duplicate_package, config_revision_mismatch, precondition_required, validation_failed, body_too_large, unsupported_media_type, rate_limited, internal_error, upstream_unavailable]
          example: config_revision_mismatch
        message:
          type: string
          description: 人类可读的短说明
          example: 配置已被其他客户端修改
        details:
          description: 结构化原因，无附加信息时为 null
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          example: {expected: '9f2c5d1e', actual: '1a7b2c3d'}
        retryable:
          type: boolean
          description: 同一请求原样重试是否可能成功
          example: false
        requestId:
          type: string
          description: 与响应头 X-Request-Id 相同，用于查审计与服务日志
          example: req_01JC7Z6Q3M8V2S9K4T1B0A
      example:
        code: unauthorized
        message: 缺少或无效的 Bearer Token
        details: null
        retryable: false
        requestId: req_01JC7Z6Q3M8V2S9K4T1B0A
    Warning:
      type: object
      description: 写入警告；不阻断写入，客户端应展示或记录
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: 稳定警告码
          enum: [duplicate_package, empty_packages, package_not_installed, inline_record_removed, config_missing, unknown_field_preserved, pm_unavailable, no_config,
                 egress_proxy_not_found, egress_credentials_ignored, egress_auth_unsupported, egress_inline_shadows_template, egress_app_not_installed,
                 egress_degraded_to_direct, egress_settings_mismatch, egress_perm_fixed, egress_probe_approximate, egress_probe_scope_app,
                 egress_relay_bind_failed, egress_relay_firewall_failed, egress_relay_uid_unknown, egress_relay_upstream_unreachable]
          example: duplicate_package
        message:
          type: string
          description: 人类可读说明
          example: com.example.app 同时被 pixel_9 与 samsung_s24_ultra 声明
        details:
          description: 结构化上下文，无则为 null
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          example: {package: com.example.app, templates: [pixel_9, samsung_s24_ultra]}
      example:
        code: empty_packages
        message: 模板 pixel_9 没有绑定任何包名
        details: {template: pixel_9}
    ValidationError:
      type: object
      description: 字段级校验错误，422 响应的 details.errors 元素
      required: [path, code, message]
      additionalProperties: false
      properties:
        path:
          type: string
          description: 字段路径，如 templates.pixel_9.dpi 或 apps[0].package
          example: templates.pixel_9.dpi
        code:
          type: string
          description: 校验错误码
          enum: [syntax_error, invalid_type, invalid_package, invalid_template_name, out_of_range, invalid_value, unknown_field, missing_required, duplicate_app_record]
          example: out_of_range
        message:
          type: string
          description: 人类可读说明
          example: dpi 必须在 120..=640
      example:
        path: apps[0].package
        code: invalid_package
        message: 不是合法 Java 包名
    HealthResponse:
      type: object
      description: 存活探针响应，无需认证
      required: [status, version, uptimeSec]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
          description: 固定为 ok
          example: ok
        version:
          type: string
          description: 服务版本
          example: 1.8.0
        uptimeSec:
          type: integer
          minimum: 0
          description: 服务已运行秒数
          example: 3600
      example: {status: ok, version: 1.11.0, uptimeSec: 3600}
    ModuleInfo:
      type: object
      description: 模块信息，来自 module.prop
      required: [id, version, versionCode]
      additionalProperties: false
      properties:
        id:
          type: string
          description: 模块 id
          example: device_faker
        version:
          type: string
          description: 模块版本（带 v 前缀）
          example: v1.7.0
        versionCode:
          type: integer
          description: 模块版本号
          example: 20261109
      example: {id: device_faker, version: v1.11.0, versionCode: 20261202}
    DeviceSummary:
      type: object
      description: 设备 Build 摘要
      required: [manufacturer, brand, model, device, android, sdk, abi]
      additionalProperties: false
      properties:
        manufacturer: {type: string, description: Build.MANUFACTURER, example: Google}
        brand: {type: string, description: Build.BRAND, example: google}
        model: {type: string, description: Build.MODEL, example: Pixel 9}
        device: {type: string, description: Build.DEVICE, example: tokay}
        android: {type: string, description: Build.VERSION.RELEASE, example: '17'}
        sdk: {type: integer, description: Build.VERSION.SDK_INT, example: 37}
        abi: {type: string, description: 服务运行的 ABI, example: arm64-v8a}
        fingerprint: {type: string, description: Build.FINGERPRINT（/device 与 /overview 返回，/status 省略）, example: 'google/tokay/tokay:17/BP2A.250605.031/13000000:user/release-keys'}
      example:
        manufacturer: Google
        brand: google
        model: Pixel 9
        device: tokay
        android: '17'
        sdk: 37
        abi: arm64-v8a
    ServerInfo:
      type: object
      description: 服务运行时信息
      required: [version, bind, uptimeSec]
      additionalProperties: false
      properties:
        version: {type: string, description: device_faker_server 版本, example: 1.8.0}
        bind: {type: string, description: 实际监听地址, example: '127.0.0.1:8686'}
        uptimeSec: {type: integer, minimum: 0, description: 已运行秒数, example: 3600}
        startedAt: {type: string, format: date-time, description: 启动时间（UTC）, example: '2026-11-24T03:00:00Z'}
        pid: {type: integer, description: 进程 pid, example: 4321}
      example: {version: 1.11.0, bind: '127.0.0.1:8686', uptimeSec: 3600, startedAt: '2026-11-24T03:00:00Z', pid: 4321}
    ConfigStatus:
      type: object
      description: 配置文件的 revision 与统计；配置文件不存在（exists=false）时 mtime 为 null、size 为 0、revision 为空内容字节的 SHA-256
      required: [revision, mtime, size, exists, templates, apps, conflicts]
      additionalProperties: false
      properties:
        revision:
          type: string
          description: '配置 revision：配置原始字节的 SHA-256，64 位小写十六进制（实现可带 sha256: 前缀，客户端须视为不透明字符串）'
          example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        mtime: {type: [string, 'null'], format: date-time, description: '文件 mtime（UTC RFC 3339）；配置文件不存在（exists=false）或元数据不可读时为 null', example: '2026-11-24T03:00:00Z'}
        size: {type: integer, minimum: 0, description: 文件字节数, example: 9361}
        exists: {type: boolean, description: 配置文件是否存在, example: true}
        templates: {type: integer, minimum: 0, description: 模板数量, example: 26}
        apps: {type: integer, minimum: 0, description: 内联应用记录数量, example: 27}
        conflicts: {type: integer, minimum: 0, description: 同一包名被多个模板声明的去重包数, example: 0}
      example:
        revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        mtime: '2026-11-24T03:00:00Z'
        size: 9361
        exists: true
        templates: 26
        apps: 27
        conflicts: 0
    StatusResponse:
      type: object
      description: 状态快照；capabilities 列出本服务已实现的能力标签
      required: [module, device, server, config, capabilities]
      additionalProperties: false
      properties:
        module:
          $ref: '#/components/schemas/ModuleInfo'
        device:
          $ref: '#/components/schemas/DeviceSummary'
        server:
          $ref: '#/components/schemas/ServerInfo'
        config:
          $ref: '#/components/schemas/ConfigStatus'
        capabilities:
          type: array
          description: 已实现能力标签
          items:
            type: string
            enum: [config, templates, apps, packages, device, validate, overview]
          example: [config, templates, apps, packages, device, validate, overview]
      example:
        module: {id: device_faker, version: v1.11.0, versionCode: 20261202}
        device: {manufacturer: Google, brand: google, model: Pixel 9, device: tokay, android: '17', sdk: 37, abi: arm64-v8a}
        server: {version: 1.11.0, bind: '127.0.0.1:8686', uptimeSec: 3600, startedAt: '2026-11-24T03:00:00Z'}
        config:
          revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
          mtime: '2026-11-24T03:00:00Z'
          size: 9361
          exists: true
          templates: 26
          apps: 27
          conflicts: 0
        capabilities: [config, templates, apps, packages, device, validate, overview, egress]
    OverviewResponse:
      type: object
      description: 设备、模板与每个已配置应用的有效配置汇总
      required: [revision, module, device, root, server, config, templates, apps, warnings]
      additionalProperties: false
      properties:
        revision:
          type: string
          description: 当前配置 revision
          example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        module:
          $ref: '#/components/schemas/ModuleInfo'
        device:
          $ref: '#/components/schemas/DeviceSummary'
        root:
          $ref: '#/components/schemas/RootInfo'
        server:
          $ref: '#/components/schemas/ServerInfo'
        config:
          $ref: '#/components/schemas/ConfigStatus'
        templates:
          type: array
          description: 全部模板
          items:
            $ref: '#/components/schemas/TemplateOverview'
        apps:
          type: array
          description: 每个已配置包名的来源与最终生效值
          items:
            $ref: '#/components/schemas/AppOverview'
        warnings:
          type: array
          description: 配置级警告
          items:
            $ref: '#/components/schemas/Warning'
    TemplateOverview:
      type: object
      description: 模板概览
      required: [name, position, packages, config]
      additionalProperties: false
      properties:
        name: {type: string, description: 模板名, example: pixel_9}
        position: {type: integer, minimum: 0, description: 0 基书写位置, example: 0}
        packages:
          type: array
          description: 绑定包名
          items: {type: string}
          example: [com.example.app]
        config:
          type: object
          description: 模板原始字段（不含 packages）
          additionalProperties: true
          example: {brand: google, model: Pixel 9, dpi: 420}
    AppOverview:
      type: object
      description: 应用概览
      required: [package, installed, source, resolved, warnings]
      additionalProperties: false
      properties:
        package: {type: string, description: 包名, example: com.example.app}
        installed: {type: [boolean, 'null'], description: 是否已安装；pm 不可用时为 null}
        source:
          $ref: '#/components/schemas/AppSource'
        resolved:
          $ref: '#/components/schemas/AppResolved'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    ConfigDocument:
      type: object
      description: |
        配置文档，字段与 config.toml 一一对应（snake_case）。
        除 apps[].package 外全部可选；null 等价于省略。
      additionalProperties: false
      properties:
        debug: {type: boolean, default: false, description: 调试日志开关, example: false}
        default_force_denylist_unmount: {type: boolean, default: false, description: 全局 FORCE_DENYLIST_UNMOUNT 默认值, example: false}
        default_hide_maps:
          type: array
          description: 默认 /proc/self/maps 清理模式
          items: {type: string, maxLength: 256}
          maxItems: 64
          default: []
          example: [df_*]
        templates:
          type: object
          description: 模板表，键为模板名；顺序即 config.toml 书写顺序，服务端保留
          additionalProperties:
            $ref: '#/components/schemas/TemplateInput'
          example:
            pixel_9: {packages: [com.example.app], brand: google, model: Pixel 9, sdk_int: 35, dpi: 420}
        apps:
          type: array
          description: 内联应用配置，顺序保留；同一 package 不得重复
          items:
            $ref: '#/components/schemas/AppConfig'
          maxItems: 500
          example:
            - {package: com.example.two, manufacturer: Xiaomi, model: 2509FPN0BC, dpi: 420}
      example:
        debug: false
        default_force_denylist_unmount: false
        default_hide_maps: []
        templates:
          pixel_9: {packages: [com.example.app], brand: google, model: Pixel 9, sdk_int: 35, dpi: 420}
        apps:
          - {package: com.example.two, manufacturer: Xiaomi, model: 2509FPN0BC}
    TemplateInput:
      type: object
      description: |
        模板字段集合（不含模板名），与 config.toml 的 [templates.<name>] 字段一致。
        PUT 为整体替换：缺席字段视为删除，packages 缺席等价于空数组。
        PATCH 为 JSON Merge Patch：缺席不改，null 删除，数组与对象整体替换。
      additionalProperties: false
      properties:
        packages:
          type: array
          description: 绑定包名列表，支持 pkg@userId；append 模式保留顺序并去重
          items:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+(@[0-9]{1,5})?$'
            example: com.example.app
          maxItems: 200
          default: []
          example: [com.example.app, 'com.example.app@999']
        manufacturer: {type: string, maxLength: 512, description: 厂商，映射 Build.MANUFACTURER, example: Google}
        brand: {type: string, maxLength: 512, description: 品牌，映射 Build.BRAND, example: google}
        marketname: {type: string, maxLength: 512, description: 市场名，仅属性 ro.product.marketname 与 OPPO/OnePlus 别名, example: Pixel 9 Pro}
        model: {type: string, maxLength: 512, description: 型号，映射 Build.MODEL, example: Pixel 9}
        name: {type: string, maxLength: 512, description: '设备内部产品名（模板字段，不是模板名），映射 ro.product.name', example: tokay}
        device: {type: string, maxLength: 512, description: 代号，映射 Build.DEVICE, example: tokay}
        product: {type: string, maxLength: 512, description: 产品代号，映射 Build.PRODUCT 与 ro.build.product, example: tokay}
        hardware: {type: string, maxLength: 512, description: 硬件名，映射 Build.HARDWARE 与 ro.hardware, example: tensor}
        board: {type: string, maxLength: 512, description: 主板名，映射 Build.BOARD 与 ro.product.board, example: g4}
        soc_model: {type: string, maxLength: 512, description: SoC 型号，映射 Build.SOC_MODEL 与 ro.soc.model, example: Tensor G4}
        fingerprint: {type: string, maxLength: 512, description: 构建指纹，映射 Build.FINGERPRINT；可自动补齐 brand/product/device 等, example: 'google/tokay/tokay:15/AP4A.250105.002/12345678:user/release-keys'}
        build_id: {type: string, maxLength: 512, description: Build ID，映射 Build.ID 与分区副本, example: AP4A.250105.002}
        display_id: {type: string, maxLength: 512, description: 系统版本号，映射 Build.DISPLAY, example: BP2A.250605.031}
        incremental: {type: string, maxLength: 512, description: 构建增量号，映射 Build.VERSION.INCREMENTAL, example: '13000000'}
        security_patch: {type: string, maxLength: 16, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$', description: 安全补丁日期，映射 Build.VERSION.SECURITY_PATCH, example: '2025-06-05'}
        characteristics: {type: string, maxLength: 512, description: 设备特性，仅属性 ro.build.characteristics, example: phone}
        android_version: {type: string, maxLength: 16, pattern: '^[0-9]{1,2}(\.[0-9]{1,2}){0,2}$', description: Android 版本，映射 Build.VERSION.RELEASE, example: '15'}
        sdk_int:
          description: SDK 版本；整数 1..1000，或字符串 __DELETE__ 删除 ro.build.version.sdk 整族（高风险）
          oneOf:
            - type: integer
              minimum: 1
              maximum: 1000
            - type: string
              const: __DELETE__
          example: 35
        dpi: {type: integer, minimum: 120, maximum: 640, description: 临时屏幕密度（由 companion 用 wm density 应用）, example: 420}
        custom_props:
          type: object
          description: 自定义属性映射，直接写入；键必须以 ro. 或 persist. 开头
          propertyNames:
            pattern: '^(ro|persist)\.[A-Za-z0-9_.-]{1,120}$'
          additionalProperties:
            type: string
            maxLength: 1024
          maxProperties: 128
          example: {ro.product.vendor.model: Pixel 9, ro.debug.mode: __DELETE__}
        force_denylist_unmount: {type: boolean, description: 是否对该应用强制 FORCE_DENYLIST_UNMOUNT（默认继承全局）, example: false}
        hide_maps:
          type: array
          description: 从 /proc/self/maps 清除的属性映射模式
          items: {type: string, maxLength: 256}
          maxItems: 64
          example: [df_*]
        companion_resetprop: {type: boolean, description: 是否跳过 COW、全部交给 companion resetprop（全系统可见）, example: false}
      example:
        packages: [com.example.app]
        manufacturer: Samsung
        brand: samsung
        model: SM-S9280
        device: e3q
        android_version: '15'
        sdk_int: 35
        dpi: 420
        custom_props: {ro.product.vendor.model: SM-S9280}
    AppConfig:
      type: object
      description: 内联应用配置（[[apps]] 记录）；整记录语义，未设置字段不回落模板，只回落全局默认
      required: [package]
      additionalProperties: false
      properties:
        package:
          type: string
          description: Java 包名，可带 @userId；同一条目在配置中必须唯一
          pattern: '^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+(@[0-9]{1,5})?$'
          example: com.example.two
        manufacturer: {type: string, maxLength: 512, description: 厂商，映射 Build.MANUFACTURER, example: Xiaomi}
        brand: {type: string, maxLength: 512, description: 品牌，映射 Build.BRAND, example: Redmi}
        marketname: {type: string, maxLength: 512, description: 市场名（仅属性）, example: Xiaomi 15 Pro}
        model: {type: string, maxLength: 512, description: 型号，映射 Build.MODEL, example: 2509FPN0BC}
        name: {type: string, maxLength: 512, description: 设备内部产品名，映射 ro.product.name, example: popsicle}
        device: {type: string, maxLength: 512, description: 代号，映射 Build.DEVICE, example: 'Xiaomi 15 Pro'}
        product: {type: string, maxLength: 512, description: 产品代号，映射 Build.PRODUCT, example: popsicle}
        hardware: {type: string, maxLength: 512, description: 硬件名，映射 Build.HARDWARE, example: qcom}
        board: {type: string, maxLength: 512, description: 主板名，映射 Build.BOARD, example: kalama}
        soc_model: {type: string, maxLength: 512, description: SoC 型号，映射 Build.SOC_MODEL, example: SM8750}
        fingerprint: {type: string, maxLength: 512, description: 构建指纹，映射 Build.FINGERPRINT, example: 'Xiaomi/popsicle/popsicle:15/AP3A.240905.015/12345:user/release-keys'}
        build_id: {type: string, maxLength: 512, description: Build ID, example: AP3A.240905.015}
        display_id: {type: string, maxLength: 512, description: 系统版本号，映射 Build.DISPLAY, example: OS2.0.1.0}
        incremental: {type: string, maxLength: 512, description: 构建增量号, example: '12345'}
        security_patch: {type: string, maxLength: 16, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$', description: 安全补丁日期, example: '2024-12-05'}
        characteristics: {type: string, maxLength: 512, description: 设备特性（仅属性）, example: phone}
        android_version: {type: string, maxLength: 16, pattern: '^[0-9]{1,2}(\.[0-9]{1,2}){0,2}$', description: Android 版本, example: '15'}
        sdk_int:
          description: SDK 版本；整数 1..1000，或字符串 __DELETE__
          oneOf:
            - type: integer
              minimum: 1
              maximum: 1000
            - type: string
              const: __DELETE__
          example: 35
        dpi: {type: integer, minimum: 120, maximum: 640, description: 临时屏幕密度, example: 420}
        custom_props:
          type: object
          description: 自定义属性映射
          propertyNames:
            pattern: '^(ro|persist)\.[A-Za-z0-9_.-]{1,120}$'
          additionalProperties:
            type: string
            maxLength: 1024
          maxProperties: 128
          example: {ro.debug.mode: __DELETE__}
        force_denylist_unmount: {type: boolean, description: 强制 FORCE_DENYLIST_UNMOUNT, example: true}
        hide_maps:
          type: array
          description: 从 /proc/self/maps 清除的属性映射模式
          items: {type: string, maxLength: 256}
          maxItems: 64
          example: []
        companion_resetprop: {type: boolean, description: 全部属性交给 companion resetprop, example: false}
      example:
        package: com.example.two
        manufacturer: Xiaomi
        brand: Redmi
        model: 2509FPN0BC
        android_version: '15'
        sdk_int: 35
        dpi: 420
    AppResolved:
      type: object
      description: 最终生效字段；未设置的字符串字段省略，布尔与数组给出继承后的有效值
      properties:
        manufacturer: {type: string, description: 生效厂商, example: Google}
        brand: {type: string, description: 生效品牌, example: google}
        marketname: {type: string, description: 生效市场名, example: Pixel 9 Pro}
        model: {type: string, description: 生效型号, example: Pixel 9}
        name: {type: string, description: 生效产品内部名, example: tokay}
        device: {type: string, description: 生效代号, example: tokay}
        product: {type: string, description: 生效产品代号, example: tokay}
        hardware: {type: string, description: 生效硬件名, example: tensor}
        board: {type: string, description: 生效主板名, example: g4}
        soc_model: {type: string, description: 生效 SoC 型号, example: Tensor G4}
        fingerprint: {type: string, description: 生效指纹, example: 'google/tokay/tokay:15/AP4A.250105.002/12345678:user/release-keys'}
        build_id: {type: string, description: 生效 Build ID, example: AP4A.250105.002}
        display_id: {type: string, description: 生效系统版本号, example: BP2A.250605.031}
        incremental: {type: string, description: 生效构建增量号, example: '13000000'}
        security_patch: {type: string, description: 生效安全补丁, example: '2025-06-05'}
        characteristics: {type: string, description: 生效设备特性, example: phone}
        android_version: {type: string, description: 生效 Android 版本, example: '15'}
        sdk_int: {type: integer, description: 生效 SDK 版本（__DELETE__ 时省略）, example: 35}
        dpi: {type: integer, description: 生效屏幕密度, example: 420}
        custom_props: {type: object, additionalProperties: {type: string}, description: 生效自定义属性, example: {ro.product.vendor.model: Pixel 9}}
        force_denylist_unmount: {type: boolean, description: 继承后的有效值, example: false}
        hide_maps: {type: array, items: {type: string}, description: 继承后的有效值, example: []}
        companion_resetprop: {type: boolean, description: 继承后的有效值, example: false}
      example:
        manufacturer: Google
        brand: google
        model: Pixel 9
        android_version: '15'
        sdk_int: 35
        dpi: 420
        force_denylist_unmount: false
        hide_maps: []
        companion_resetprop: false
    TemplateListItem:
      type: object
      description: 模板列表项；position 为配置文件中的 0 基序号
      required: [name, position, packages, packageCount, fieldsSet]
      additionalProperties: false
      properties:
        name: {type: string, description: 模板名, example: pixel_9}
        position: {type: integer, minimum: 0, description: 配置文件中的 0 基序号, example: 0}
        packages:
          type: array
          description: 绑定的包名（保序）
          items: {type: string}
          example: [com.example.app]
        packageCount: {type: integer, minimum: 0, description: packages 长度, example: 1}
        fieldsSet:
          type: array
          description: 该模板显式设置的字段名（snake_case）
          items: {type: string}
          example: [android_version, brand, dpi, model, sdk_int]
      example:
        name: pixel_9
        position: 0
        packages: [com.example.app]
        packageCount: 1
        fieldsSet: [android_version, brand, dpi, model, sdk_int]
    TemplateListResponse:
      type: object
      description: 模板列表；items 顺序等于配置文件书写顺序
      required: [revision, total, nextCursor, items]
      additionalProperties: false
      properties:
        revision: {type: string, description: 整份配置的 revision, example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'}
        total: {type: integer, minimum: 0, description: 过滤后的模板总数, example: 2}
        nextCursor: {type: [string, 'null'], description: 下一页游标，null 表示结束, example: null}
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateListItem'
      example:
        revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        total: 1
        nextCursor: null
        items:
          - {name: pixel_9, position: 0, packages: [com.example.app], packageCount: 1, fieldsSet: [brand, model]}
    TemplateResponse:
      type: object
      description: 模板详情；模板名在顶层 name，template 为 TemplateInput（不含模板名）
      required: [revision, position, name, template]
      additionalProperties: false
      properties:
        revision: {type: string, description: 配置 revision, example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'}
        position: {type: integer, minimum: 0, description: 配置文件中的 0 基序号, example: 0}
        name: {type: string, description: 模板名（config.toml 的配置键）, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$', example: pixel_9}
        template:
          $ref: '#/components/schemas/TemplateInput'
      example:
        revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        position: 0
        name: pixel_9
        template: {packages: [com.example.app], brand: google, model: Pixel 9, dpi: 420}
    AppSource:
      type: object
      description: 应用配置来源
      required: [type, template, alsoInline]
      additionalProperties: false
      properties:
        type: {type: string, enum: [inline, template, none], description: 命中来源, example: template}
        template: {type: [string, 'null'], description: 命中的模板名；内联或未配置时为 null, example: pixel_9}
        alsoInline: {type: boolean, description: 内联记录存在但同时命中模板（内联优先）, example: false}
      example: {type: template, template: pixel_9, alsoInline: false}
    AppListItem:
      type: object
      description: 已配置应用列表项
      required: [package, position, source, fieldsSet]
      additionalProperties: false
      properties:
        package: {type: string, description: 包名, example: com.example.two}
        position: {type: integer, minimum: 0, description: apps 数组中的 0 基序号, example: 0}
        source:
          $ref: '#/components/schemas/AppSource'
        fieldsSet:
          type: array
          description: 内联记录显式设置的字段名
          items: {type: string}
          example: [dpi, manufacturer, model]
      example: {package: com.example.two, position: 0, source: {type: inline, template: null, alsoInline: false}, fieldsSet: [dpi, manufacturer, model]}
    AppListResponse:
      type: object
      description: 已配置应用列表（只含 [[apps]] 内联记录）
      required: [revision, total, nextCursor, items]
      additionalProperties: false
      properties:
        revision: {type: string, description: 配置 revision, example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'}
        total: {type: integer, minimum: 0, description: 记录总数, example: 1}
        nextCursor: {type: [string, 'null'], description: 下一页游标, example: null}
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppListItem'
      example:
        revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        total: 1
        nextCursor: null
        items:
          - {package: com.example.two, position: 0, source: {type: inline, template: null, alsoInline: false}, fieldsSet: [dpi, manufacturer, model]}
    AppResponse:
      type: object
      description: 单应用解析结果；未配置的包名也返回 200，source.type=none 且带 no_config 警告
      required: [package, revision, installed, source, resolved, warnings]
      additionalProperties: false
      properties:
        package: {type: string, description: 包名, example: com.example.app}
        revision: {type: string, description: 配置 revision, example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'}
        installed: {type: [boolean, 'null'], description: 是否能从 PackageManager 查到（pm 不可用时 null）, example: true}
        source:
          $ref: '#/components/schemas/AppSource'
        resolved:
          $ref: '#/components/schemas/AppResolved'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
      example:
        package: com.example.app
        revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        installed: true
        source: {type: template, template: pixel_9, alsoInline: false}
        resolved: {brand: google, model: Pixel 9, android_version: '15', sdk_int: 35, dpi: 420}
        warnings: []
    AppUpsertRequest:
      type: object
      description: |
        template 与 config 必须恰好提供一个。
        template 模式：把该包加入模板 packages（末尾追加、去重），detachFromTemplates 默认 true 会从其它模板移除该包，
        并删除同包名的内联记录（回 inline_record_removed 警告）。
        config 模式：整记录替换内联 [[apps]] 记录；detachFromTemplates 默认 false。
      additionalProperties: false
      properties:
        template: {type: [string, 'null'], description: 绑定到的模板名（与 config 互斥）, example: pixel_9}
        config:
          oneOf:
            - $ref: '#/components/schemas/AppConfig'
            - type: 'null'
          description: 内联配置记录（与 template 互斥）
        detachFromTemplates: {type: boolean, description: 是否从其它模板移除该包（template 模式默认 true，config 模式默认 false）, example: true}
      example:
        template: pixel_9
        detachFromTemplates: true
    WriteResult:
      type: object
      description: 写操作结果；dry_run 时 revision 仍为当前值且 backupId 为 null
      required: [revision, dryRun, warnings]
      additionalProperties: false
      properties:
        revision: {type: string, description: 写入后的配置 revision, example: '77aabbccddeeff00112233445566778899aabbccddeeff001122334455667788'}
        previousRevision: {type: [string, 'null'], description: 写入前 revision；首次创建为 null, example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'}
        dryRun: {type: boolean, description: 是否为演练（未落盘）, example: false}
        backupId: {type: [string, 'null'], description: 自动备份 ID；dry_run 时为 null, example: 20261124T031002Z-9f2c}
        diff: {type: string, description: 仅在 diff=true 或 dry_run=true 时出现；上限 64 KiB, example: '--- a/config.toml\n+++ b/config.toml\n@@ -1 +1,2 @@\n debug = false\n+default_hide_maps = []'}
        diffTruncated: {type: boolean, description: diff 是否被截断, example: false}
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
      example:
        revision: '77aabbccddeeff00112233445566778899aabbccddeeff001122334455667788'
        previousRevision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        dryRun: false
        backupId: 20261124T031002Z-9f2c
        diffTruncated: false
        warnings: []
    ConfigResponse:
      type: object
      description: 配置读取响应（format=json）；配置文件不存在时 exists=false、config 为空文档、mtime 为 null、size 为 0
      required: [revision, mtime, size, exists, warnings, config]
      additionalProperties: false
      properties:
        revision: {type: string, description: 配置 revision, example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'}
        mtime: {type: [string, 'null'], format: date-time, description: '文件 mtime（UTC RFC 3339）；配置文件不存在（exists=false）或元数据不可读时为 null', example: '2026-11-24T03:00:00Z'}
        size: {type: integer, minimum: 0, description: 文件字节数, example: 9361}
        exists: {type: boolean, description: 配置文件是否存在, example: true}
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        config:
          $ref: '#/components/schemas/ConfigDocument'
      example:
        revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        mtime: '2026-11-24T03:00:00Z'
        size: 9361
        exists: true
        warnings: []
        config: {debug: false, templates: {}, apps: []}
    ConfigRevisionResponse:
      type: object
      description: 配置 revision 与文件元信息；配置文件不存在时 exists=false、mtime 为 null、size 为 0
      required: [revision, mtime, size, exists]
      additionalProperties: false
      properties:
        revision: {type: string, description: 配置 revision, example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'}
        mtime: {type: [string, 'null'], format: date-time, description: '文件 mtime（UTC RFC 3339）；配置文件不存在（exists=false）或元数据不可读时为 null', example: '2026-11-24T03:00:00Z'}
        size: {type: integer, minimum: 0, description: 文件字节数, example: 9361}
        exists: {type: boolean, description: 文件是否存在, example: true}
      example:
        revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        mtime: '2026-11-24T03:00:00Z'
        size: 9361
        exists: true
    ValidateRequest:
      type: object
      description: 校验请求；TOML 内容为字符串，JSON 内容可为对象或字符串
      required: [format, content]
      additionalProperties: false
      properties:
        format: {type: string, enum: [toml, json], description: 内容格式, example: toml}
        content:
          description: 待校验内容，上限 2 MiB
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          example: |
            debug = false

            [templates.pixel_9]
            packages = ["com.example.app"]
            dpi = 900
      example:
        format: toml
        content: |
          debug = false
          [templates.pixel_9]
          dpi = 900
    ValidateResponse:
      type: object
      description: 校验结果；valid=false 仍是 200，errors 给字段级原因
      required: [valid, revision, errors, warnings]
      additionalProperties: false
      properties:
        valid: {type: boolean, description: 内容是否合法, example: false}
        revision: {type: string, description: 校验时的当前配置 revision, example: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
      example:
        valid: false
        revision: '9f2c5d1e8a7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5'
        errors:
          - {path: templates.pixel_9.dpi, code: out_of_range, message: 'dpi 必须在 120..=640'}
        warnings: []
    BindPackagesRequest:
      type: object
      description: 批量绑定包名；append 追加去重，replace 整体替换
      required: [packages]
      additionalProperties: false
      properties:
        packages:
          type: array
          description: 要绑定的包名（1..200 项，支持 pkg@userId）
          minItems: 1
          maxItems: 200
          items:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+(@[0-9]{1,5})?$'
            example: com.example.app
          example: [com.example.app, 'com.example.app@999']
        mode: {type: string, enum: [append, replace], default: append, description: 追加或整体替换, example: append}
      example:
        packages: [com.example.app, 'com.example.app@999']
        mode: append
    RestartRequest:
      type: object
      description: 重启应用请求；字段全可选，请求体可省略
      additionalProperties: false
      properties:
        forceStop: {type: boolean, default: true, description: 是否执行 am force-stop, example: true}
        launch: {type: boolean, default: false, description: force-stop 后是否重新拉起, example: false}
        user: {type: integer, minimum: 0, default: 0, description: Android 用户 id（pkg 中的 @uid 优先）, example: 0}
      example: {forceStop: true, launch: false, user: 0}
    RestartResponse:
      type: object
      description: 重启结果
      required: [package, forceStopped, launched, durationMs]
      additionalProperties: false
      properties:
        package: {type: string, description: 包名, example: com.example.app}
        forceStopped: {type: boolean, description: 是否执行了 force-stop, example: true}
        launched: {type: boolean, description: 是否重新拉起, example: false}
        durationMs: {type: integer, minimum: 0, description: 耗时（毫秒）, example: 118}
      example: {package: com.example.app, forceStopped: true, launched: false, durationMs: 118}
    PackageInfo:
      type: object
      description: 已安装包元数据；label 本增量恒为 null
      required: [package, userIds, installed, isSystem]
      additionalProperties: false
      properties:
        package: {type: string, description: 包名, example: com.android.chrome}
        userIds: {type: array, items: {type: integer, minimum: 0}, description: 已安装的用户 id 列表, example: [0]}
        installed: {type: boolean, description: 是否安装, example: true}
        isSystem: {type: boolean, description: 是否系统应用, example: true}
        versionName: {type: [string, 'null'], description: versionName, example: 131.0.6778.200}
        versionCode: {type: [integer, 'null'], description: versionCode, example: 677820000}
        label: {type: [string, 'null'], description: 应用名（本增量恒为 null）, example: null}
      example:
        package: com.android.chrome
        userIds: [0]
        installed: true
        isSystem: true
        versionName: 131.0.6778.200
        versionCode: 677820000
        label: null
    PackagesResponse:
      type: object
      description: 已安装包列表；source=unavailable 时 items 为空并带 pm_unavailable 警告
      required: [total, nextCursor, source, warnings, items]
      additionalProperties: false
      properties:
        total: {type: integer, minimum: 0, description: 总数, example: 1}
        nextCursor: {type: [string, 'null'], description: 下一页游标, example: null}
        source: {type: string, enum: [pm, unavailable], description: 数据来源, example: pm}
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PackageInfo'
      example:
        total: 1
        nextCursor: null
        source: pm
        warnings: []
        items:
          - {package: com.android.chrome, userIds: [0], installed: true, isSystem: true, versionName: 131.0.6778.200, versionCode: 677820000, label: null}
    RootInfo:
      type: object
      description: root 管理器信息；无法识别时 manager 为 null
      required: [manager, version]
      additionalProperties: false
      properties:
        manager: {type: [string, 'null'], description: 'kernelsu / magisk / apatch，或 null', example: kernelsu}
        version: {type: [string, 'null'], description: 管理器版本, example: 1.0.7}
      example: {manager: kernelsu, version: 1.0.7}
    DeviceResponse:
      type: object
      description: 设备与模块信息
      required: [module, device, server, root]
      additionalProperties: false
      properties:
        module:
          $ref: '#/components/schemas/ModuleInfo'
        device:
          $ref: '#/components/schemas/DeviceSummary'
        server:
          $ref: '#/components/schemas/ServerInfo'
        root:
          $ref: '#/components/schemas/RootInfo'
      example:
        module: {id: device_faker, version: v1.11.0, versionCode: 20261202}
        device: {manufacturer: Google, brand: google, model: Pixel 9, device: tokay, android: '17', sdk: 37, abi: arm64-v8a, fingerprint: 'google/tokay/tokay:17/BP2A.250605.031/13000000:user/release-keys'}
        server: {version: 1.11.0, bind: '127.0.0.1:8686', uptimeSec: 3600, pid: 4321}
        root: {manager: kernelsu, version: 1.0.7}
    DevicePropsResponse:
      type: object
      description: getprop 白名单读取结果；不存在的键放入 missing
      required: [props, missing, source]
      additionalProperties: false
      properties:
        props:
          type: object
          description: 读到的属性键值
          additionalProperties: {type: string}
          example: {ro.product.model: Pixel 9}
        missing:
          type: array
          description: 请求了但设备上不存在的键
          items: {type: string}
          example: [ro.vendor.does_not_exist]
        source: {type: string, enum: [getprop, unavailable], description: 数据来源, example: getprop}
      example:
        props: {ro.product.model: Pixel 9, ro.build.fingerprint: 'google/tokay/tokay:17/BP2A.250605.031/13000000:user/release-keys'}
        missing: [ro.vendor.does_not_exist]
        source: getprop
    UserInfo:
      type: object
      description: Android 用户信息
      required: [id, running, isCurrent]
      additionalProperties: false
      properties:
        id: {type: integer, minimum: 0, description: 用户 id, example: 0}
        name: {type: [string, 'null'], description: 用户名称, example: Owner}
        running: {type: boolean, description: 是否运行中, example: true}
        isCurrent: {type: boolean, description: 是否当前用户, example: true}
      example: {id: 0, name: Owner, running: true, isCurrent: true}
    DeviceUsersResponse:
      type: object
      description: 用户列表
      required: [users]
      additionalProperties: false
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserInfo'
      example:
        users:
          - {id: 0, name: Owner, running: true, isCurrent: true}
          - {id: 999, name: Work, running: true, isCurrent: false}
    ConfigSchema:
      type: object
      description: |
        schemars 0.8 依据 device_faker_core::config::Config 生成的单份 JSON Schema，方言为 draft-07
        （$schema = http://json-schema.org/draft-07/schema#）。Config 字段直接位于顶层 properties；
        被引用的类型（DeviceTemplate、AppConfig、NumberSetting）放在 definitions，$ref 形如
        #/definitions/DeviceTemplate。没有 $id 与 additionalProperties: false；
        该端点的 payload 与 OpenAPI 文档自身的 jsonSchemaDialect 无关。
      additionalProperties: true
      required: ['$schema', title, type, properties, definitions]
      properties:
        '$schema': {type: string, const: 'http://json-schema.org/draft-07/schema#', description: draft-07 方言 URI, example: 'http://json-schema.org/draft-07/schema#'}
        title: {type: string, description: Schema 标题, example: DeviceFakerConfig}
        type: {type: string, const: object, description: 顶层类型, example: object}
        properties: {type: object, additionalProperties: true, description: 'Config 顶层字段：apps、debug、default_force_denylist_unmount、default_hide_maps、templates'}
        definitions: {type: object, additionalProperties: true, description: 被引用类型的定义（draft-07 关键字），包含 DeviceTemplate、AppConfig、NumberSetting}
      example:
        '$schema': 'http://json-schema.org/draft-07/schema#'
        title: DeviceFakerConfig
        type: object
        properties:
          apps: {default: [], items: {'$ref': '#/definitions/AppConfig'}, type: array}
          debug: {default: false, type: boolean}
          default_force_denylist_unmount: {default: false, type: boolean}
          default_hide_maps: {default: [], items: {type: string}, type: array}
          templates: {additionalProperties: {'$ref': '#/definitions/DeviceTemplate'}, default: {}, type: object}
        definitions:
          NumberSetting:
            anyOf:
              - {type: integer, minimum: 1.0, maximum: 1000.0, description: 整数伪装值（sdk_int）}
              - {type: string, const: __DELETE__, description: 删除 ro.build.version.sdk 整族}
            description: 整数伪装值，或字符串 __DELETE__
            title: NumberSetting
          DeviceTemplate: {description: 机型模板, type: object}
          AppConfig: {required: [package], type: object}

    EgressProxySummary:
      type: object
      description: 脱敏代理摘要（固定 7 个键；永远不含 username / password）
      required: [name, type, host, port, hasCredentials, localPort, relayActive]
      properties:
        name: {type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$', example: office_http}
        type: {type: string, enum: [http, socks5], description: 协议（TOML 键同名 type）, example: http}
        host: {type: string, maxLength: 253, description: 主机名或 IPv4，不含 scheme / 端口 / 路径, example: 198.51.100.10}
        port: {type: integer, minimum: 1, maximum: 65535, example: 8080}
        hasCredentials: {type: boolean, description: '唯一的凭据信号：username 或 password 任一有值即 true', example: false}
        localPort: {type: [integer, 'null'], minimum: 1, maximum: 65535, description: 'server 分配的中继端口；未分配或中继关闭时为 null', example: 17831}
        relayActive: {type: boolean, description: 该定义此刻是否正在经中继, example: true}
    EgressAppView:
      type: object
      description: 应用级 egress 视图（只列显式写了 [[apps]].egress 的记录）
      required: [package, egress, effective, proxy]
      properties:
        package: {type: string, description: 包名（可带 @userId）, example: com.example.a}
        egress: {type: string, description: 配置值：代理名或 __DIRECT__, example: lab_socks}
        effective: {type: string, enum: [proxy, direct], example: proxy}
        proxy: {type: [string, 'null'], description: 生效代理名；直连或定义缺失时为 null, example: lab_socks}
    EgressReadback:
      type: object
      description: 设备侧真实读回值（方案 A 的生效证据）
      required: [matches, at]
      properties:
        settingsValue: {type: [string, 'null'], description: 'settings get global http_proxy 原文：null / :0 / host:port', example: '198.51.100.10:8080'}
        dumpsysGlobalProxy: {type: [string, 'null'], description: dumpsys connectivity 的 Global proxy 行原文, example: 'Global proxy: [198.51.100.10] port: 8080'}
        matches: {type: boolean, description: 读回值是否等于期望值, example: true}
        at: {type: string, format: date-time, example: '2026-12-01T03:00:00Z'}
    EgressLastProbe:
      type: object
      description: 最近一次探测（内存态，服务重启后为 null）
      required: [ok, latencyMs, checkedAt, scope, via]
      properties:
        ok: {type: boolean, example: true}
        exitIp: {type: [string, 'null'], example: 198.51.100.77}
        latencyMs: {type: integer, minimum: 0, example: 412}
        checkedAt: {type: string, format: date-time, example: '2026-12-01T02:59:12Z'}
        scope: {type: string, enum: [device, app], example: device}
        via: {type: string, enum: [proxy, direct], example: proxy}
        proxy: {type: [string, 'null'], example: office_http}
        upstreamStatus: {type: [integer, 'null'], minimum: 100, maximum: 599, example: 200}
        errorCode: {type: [string, 'null'], description: 失败时的稳定错误码, example: null}
    EgressHealth:
      type: object
      description: fail-open 状态（判定只在显式探测失败 / 写入后读回不一致 / 启动自愈不一致三个时点发生）
      required: [degraded]
      properties:
        degraded: {type: boolean, example: false}
        degradedSince: {type: [string, 'null'], format: date-time, example: null}
        degradedReason: {type: [string, 'null'], enum: [probe_failed, settings_mismatch, null], example: null}
        lastProbe: {oneOf: [{$ref: '#/components/schemas/EgressLastProbe'}, {type: 'null'}]}
    EgressFileMeta:
      type: object
      description: egress.toml 元数据（只给存在性 / 大小 / 时间，不给内容）
      required: [exists, size]
      properties:
        exists: {type: boolean, example: true}
        size: {type: integer, minimum: 0, example: 412}
        mtime: {type: [string, 'null'], format: date-time, example: '2026-12-01T02:58:03Z'}
    EgressState:
      type: object
      description: GET / PUT / DELETE /api/v1/egress 共用的状态块（全部 lowerCamelCase）
      required: [configured, mode, effectiveMode, failOpen, probeUrl, probeTimeoutSeconds, exclusionList, proxies, apps, applied, readback, health, egressFile, relay, warnings]
      properties:
        configured: {type: boolean, description: 至少一条定义 / 设备级 default / 任一应用覆盖, example: true}
        mode: {type: string, enum: [proxy, direct], description: 期望模式（default 非空即 proxy）, example: proxy}
        effectiveMode: {type: string, enum: [proxy, direct], description: 计入 fail-open 后的实际模式, example: proxy}
        default: {type: [string, 'null'], description: '设备级代理名（[egress].default）', example: office_http}
        failOpen: {type: boolean, description: '代理不可用时是否放行直连（[probe].fail_open）', example: true}
        probeUrl: {type: string, format: uri, pattern: '^http://', example: 'http://checkip.example.com/'}
        probeTimeoutSeconds: {type: integer, minimum: 1, maximum: 30, example: 5}
        exclusionList: {type: array, items: {type: string, maxLength: 64}, maxItems: 32, example: ['10.0.0.0/8']}
        upstream: {oneOf: [{$ref: '#/components/schemas/EgressProxySummary'}, {type: 'null'}]}
        proxies: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/EgressProxySummary'}}
        apps: {type: array, items: {$ref: '#/components/schemas/EgressAppView'}}
        applied: {type: boolean, description: 只描述方案 A：读回值与期望值是否一致, example: true}
        readback: {$ref: '#/components/schemas/EgressReadback'}
        health: {$ref: '#/components/schemas/EgressHealth'}
        egressFile: {$ref: '#/components/schemas/EgressFileMeta'}
        relay: {$ref: '#/components/schemas/EgressRelayView'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Warning'}
    EgressResponse:
      allOf:
        - $ref: '#/components/schemas/EgressState'
        - type: object
          required: [revision, configRevision]
          properties:
            revision: {type: string, pattern: '^[0-9a-f]{64}$', description: egress revision（写端点的 If-Match）}
            configRevision: {type: string, pattern: '^[0-9a-f]{64}$', description: config.toml 的 revision（仅排障 / 展示）}
    EgressWriteResult:
      allOf:
        - $ref: '#/components/schemas/EgressState'
        - type: object
          required: [revision, configRevision, dryRun, changed, diffTruncated, warnings]
          properties:
            revision: {type: string, pattern: '^[0-9a-f]{64}$', description: 写入后的 egress revision（dryRun 时为当前值）}
            previousRevision: {type: [string, 'null'], description: 写入前的 egress revision}
            configRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
            dryRun: {type: boolean, example: false}
            changed: {type: boolean, description: 是否真的落盘（false = 幂等短路）, example: true}
            backupId: {type: [string, 'null'], example: 20261201T030000Z-5b1f}
            diff: {type: string, description: 仅 diff=true 或 dry_run=true 时出现}
            diffTruncated: {type: boolean, example: false}
    EgressProxyInput:
      type: object
      description: PUT /egress 的代理定义（凭据只写不读）
      required: [name, type, host, port]
      additionalProperties: false
      properties:
        name: {type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$', example: office_http}
        type: {type: string, enum: [http, socks5], example: http}
        host: {type: string, maxLength: 253, example: 198.51.100.10}
        port: {type: integer, minimum: 1, maximum: 65535, example: 8080}
        username: {type: [string, 'null'], maxLength: 128, description: 省略 = 保留已存值；null = 清除}
        password: {type: [string, 'null'], maxLength: 256, description: 省略 = 保留已存值；null = 清除}
    EgressAppInput:
      type: object
      description: PUT /egress 的应用级覆盖（只改 egress 字段，不做整记录替换）
      required: [package, egress]
      additionalProperties: false
      properties:
        package: {type: string, example: com.example.a}
        egress: {type: [string, 'null'], description: '代理名 / __DIRECT__ / null（清除该应用覆盖）', example: lab_socks}
    EgressUpdateRequest:
      type: object
      description: PUT /egress 请求体：省略 = 不改，null = 清空，数组 = 整体替换
      additionalProperties: false
      properties:
        default: {type: [string, 'null'], description: '设备级代理名；null 清除；不接受 __DIRECT__，也不接受 type=socks5 的定义（设备级只支持 http，422 invalid_egress_default；旧配置 settings 黑洞 127.0.0.1:9 + egress_relay_device_socks5_unsupported）'}
        failOpen: {type: boolean}
        probeUrl: {type: [string, 'null'], format: uri, pattern: '^http://', maxLength: 512}
        probeTimeoutSeconds: {type: integer, minimum: 1, maximum: 30}
        exclusionList: {type: [array, 'null'], items: {type: string, maxLength: 64}, maxItems: 32}
        proxies: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/EgressProxyInput'}, description: 整体替换；省略时已存定义与密码保持不变}
        apps: {type: [array, 'null'], items: {$ref: '#/components/schemas/EgressAppInput'}, description: 'null = 清除所有应用覆盖；省略 = 不改'}
    EgressProbeRequest:
      type: object
      description: POST /egress/probe 请求体（可省略）
      additionalProperties: false
      properties:
        package: {type: [string, 'null'], description: 'null = 设备级链路；给定包名 = 用该应用的生效代理定义', example: null}
        url: {type: [string, 'null'], format: uri, pattern: '^http://', maxLength: 512}
        via: {type: string, enum: [upstream, relay], default: upstream, description: 'v1.11.0：探测路径；缺省 upstream 与 v1.10.0 逐字节兼容，relay 表示经设备内中继', example: upstream}
    EgressProbeResponse:
      type: object
      required: [ok, exitIp, latencyMs, checkedAt, scope, via, url, approximate, warnings]
      properties:
        ok: {type: boolean, description: 成功时恒 true（失败走错误信封）, example: true}
        exitIp: {type: string, description: 出口 IP 字面量（IPv4 / IPv6）, example: 198.51.100.77}
        latencyMs: {type: integer, minimum: 0, example: 412}
        checkedAt: {type: string, format: date-time, example: '2026-12-01T03:00:00Z'}
        scope: {type: string, enum: [device, app], example: device}
        via: {type: string, enum: [proxy, direct, relay], description: 'relay 表示经设备内中继（v1.11.0）', example: proxy}
        proxy: {type: [string, 'null'], example: office_http}
        relayPort: {type: [integer, 'null'], minimum: 1, maximum: 65535, description: 'via=relay 时实际使用的中继端口，其余为 null', example: null}
        url: {type: string, format: uri, example: 'http://checkip.example.com/'}
        upstreamStatus: {type: [integer, 'null'], minimum: 100, maximum: 599, example: 200}
        approximate: {type: boolean, description: scope=app 时恒 true（探测在服务进程内完成）, example: false}
        warnings: {type: array, items: {$ref: '#/components/schemas/Warning'}}
    EgressProxyListItem:
      allOf:
        - $ref: '#/components/schemas/EgressProxySummary'
        - type: object
          required: [usedAsDefault, apps]
          properties:
            usedAsDefault: {type: boolean, description: '是否为 [egress].default 指向的定义', example: true}
            apps: {type: array, items: {type: string}, description: 引用该定义的包名, example: []}
    EgressProxiesResponse:
      type: object
      required: [revision, configRevision, total, egressFile, items, warnings]
      properties:
        revision: {type: string, pattern: '^[0-9a-f]{64}$'}
        configRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
        total: {type: integer, minimum: 0, maximum: 64, example: 2}
        egressFile: {$ref: '#/components/schemas/EgressFileMeta'}
        items: {type: array, items: {$ref: '#/components/schemas/EgressProxyListItem'}}
        warnings: {type: array, items: {$ref: '#/components/schemas/Warning'}}
    EgressRelayRestartResponse:
      type: object
      required: [restartedAt, relay, warnings]
      properties:
        restartedAt: {type: string, format: date-time, example: '2026-12-01T03:05:00Z'}
        relay: {$ref: '#/components/schemas/EgressRelayView'}
        warnings: {type: array, items: {$ref: '#/components/schemas/Warning'}}
    EgressRelayView:
      type: object
      description: 设备内认证中继的运行态（GET / PUT / DELETE /egress 与 relay/restart 共用；全部 lowerCamelCase）
      required: [enabled, basePort, failOpen, at, limits, listeners, firewall, portChanges, restartRequiredApps]
      properties:
        enabled: {type: boolean, description: '[relay].enabled 的实际生效值', example: true}
        basePort: {type: integer, minimum: 17800, maximum: 17899, example: 17800}
        failOpen: {type: boolean, description: '[probe].fail_open 的实际生效值', example: true}
        at: {type: string, format: date-time, example: '2026-12-01T03:00:00Z'}
        limits: {$ref: '#/components/schemas/EgressRelayLimits'}
        listeners: {type: array, items: {$ref: '#/components/schemas/EgressRelayListener'}}
        firewall: {$ref: '#/components/schemas/EgressRelayFirewall'}
        portChanges: {type: array, items: {$ref: '#/components/schemas/EgressRelayPortChange'}, description: '仅写响应可能非空；GET 恒为 []'}
        restartRequiredApps: {type: array, items: {type: string}, description: 仅写响应可能非空；端口变化的定义所引用、需要重启的应用}
    EgressRelayLimits:
      type: object
      required: [maxConnections, maxConnectionsPerUid]
      properties:
        maxConnections: {type: integer, minimum: 1, maximum: 1024, example: 256}
        maxConnectionsPerUid: {type: integer, minimum: 0, maximum: 1024, description: 0 = 不限, example: 64}
    EgressRelayListener:
      type: object
      required: [proxy, port, scope, listening, uidPolicy, allowedUids, activeConnections, lastError]
      properties:
        proxy: {type: string, example: lab_socks}
        port: {type: integer, minimum: 1, maximum: 65535, example: 17831}
        scope: {type: string, enum: [device, app], example: app}
        listening: {type: boolean, example: true}
        uidPolicy: {type: string, enum: [all, restricted], example: restricted}
        allowedUids: {type: array, items: {type: integer}, example: [0, 10123]}
        activeConnections: {type: integer, minimum: 0, example: 0}
        lastError: {oneOf: [{$ref: '#/components/schemas/EgressRelayListenerError'}, {type: 'null'}]}
    EgressRelayListenerError:
      type: object
      required: [code, reason, at]
      properties:
        code: {type: string, example: egress_relay_bind_failed}
        reason: {type: string, example: addr_in_use}
        at: {type: string, format: date-time}
    EgressRelayFirewall:
      type: object
      required: [applied, rules, allowRules, denyRules]
      properties:
        applied: {type: boolean, description: 期望规则是否已落地（由 iptables -S 现算）, example: true}
        rules: {type: integer, minimum: 0, example: 9}
        allowRules: {type: integer, minimum: 0, example: 7}
        denyRules: {type: integer, minimum: 0, example: 1}
        lastError:
          oneOf:
            - type: object
              required: [code, reason, op, at]
              properties:
                code: {type: string, example: egress_relay_firewall_failed}
                reason: {type: string, enum: [iptables_missing, command_failed, permission_denied, state_mismatch]}
                op: {type: string, enum: [apply, clear]}
                at: {type: string, format: date-time}
            - type: 'null'
    EgressRelayPortChange:
      type: object
      required: [proxy, from, to, reason]
      properties:
        proxy: {type: string}
        from: {type: [integer, 'null'], minimum: 1, maximum: 65535}
        to: {type: [integer, 'null'], minimum: 1, maximum: 65535}
        reason: {type: string, enum: [initial, collision, out_of_range, addr_in_use, role_change, credentials_change]}
